{{ define "main" }}
<div class="bbs-container">
  <nav class="bbs-breadcrumb"><a href="/">首頁</a> / <a href="/bbs/">BBS</a> / <span>{{ .Title }}</span></nav>
  <h1 class="bbs-title">{{ .Title }}</h1>
  <p class="bbs-meta">共 {{ len .Pages }} 篇主題</p>
  <ul class="bbs-thread-list">
    {{ range .Pages.ByDate.Reverse }}
    <li class="bbs-thread-item"><a href="{{ .RelPermalink }}">{{ .Title }}</a> <span class="bbs-thread-meta">{{ .Params.author }} · {{ .Date.Format "2006-01-02" }}</span></li>
    {{ end }}
  </ul>
</div>
{{ end }}
