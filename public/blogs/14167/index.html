<hr>
<p>印度種姓制度,延續下來,印度教享受最大成果,回教.錫克教被排在外,產生極大怨恨,眼看很多印度人成為富豪,因而爆發許多衝突.</p>
<p>印度在1947年英國結束印度殖民統治,把信仰回教地區分為西巴基斯坦.東巴基斯坦.喀什米爾,但不把喀什米爾,列入印度或巴基斯坦,而是將其部份領土分別由印度或巴基斯坦來控制.造成印巴衝突的火種.</p>
