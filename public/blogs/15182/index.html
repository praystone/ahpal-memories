<p>         校長的角色複雜,難為,校長是學校的領航者,是課程教學的帶領者,是社區關係的公關者,所以社會責任重大,身為校校身兼五種角色</p>
<p>一.是學校老師.學生生的教育者</p>
<p>二.是學校行政的管理者</p>
<p>三.是學校文化的領導者</p>
<p>四.是專業社群的一份子</p>
<p>五.做好自己個人角色</p>
