<p>內容簡介</p>
<p>    　一個速成的九世善人，被陰司判官送到了大明正德年間。</p>
<p>　　自認沒有一技之長、又對歷史一知半解的史上最無能的穿越者鄭大善人，幸好遇上了一個最不像皇帝的皇帝，一個不想當皇帝卻不得不當皇帝的朱厚照。</p>
<p>　　國家和個人的命運，就像歷史洪流中的一條小船兒，且看他如何把這艘船的舵掌握在自已手中。</p>
