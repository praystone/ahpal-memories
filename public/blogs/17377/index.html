<hr>
<p>所謂&quot;嚴官出多賊&quot;,懲罰重不一定是好事,學術界認為,懲罰重的話,會產生失調,容易讓犯錯者,找到外部理由,因為考試做弊被抓會被重罰,所以不要做弊,如此只把重罰與作弊被抓聯結,以後還是會再作弊的.如果作弊處罰不是很重,其失調時找不到外部理由,只好找內部理由,或許會認為作弊有失公平,對於自己的品格有損害.以後比較不會再犯.</p>
