<p>6年前，因電影「海底總動員」而暴紅的「公主小丑魚」，一度受盛名之累，造成台灣海域的小丑魚幾乎被抓光賣到水族館。近年來因台東水產試驗所人工繁殖成功，並放流海中，台灣海域在多處已發現小丑魚亮麗的蹤影，中華民國瑚礁學會在墾丁海域，發現已有10叢以上的海葵有小丑魚棲息，成為墾丁海洋觀光的金雞母之一。</p>
