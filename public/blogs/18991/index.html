<p>嘉義市社區大學蘭潭自然生態工作坊學員，日前在蘭潭進水口山坡，發現「台灣綠貓蛛」族群蹤跡，上百隻散布林間。社大嘉華校區執行長陳柏濡說，因受環境汙染，大量綠貓蛛已不多見。台灣綠貓蛛警覺性高，鏡頭一接近就機警逃離，留下漂亮身影。</p>
