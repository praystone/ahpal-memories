<p><strong>發文</strong>：2009-10-29</p>

<hr>
<p>沒想到務農的生活還真是清苦呀</p>
<p>累歸累  還是有很不錯的成就感</p>
<p>目前暫時決定好好做人</p>
<ol>
<li>
<p>不再偷別人家的東西了</p>
</li>
<li>
<p>每天最後一次收成後  會種牧草下去讓大家隔天早上分享</p>
</li>
</ol>
<p>所以我也不打算養狗了  免得咬傷大家</p>
<p>其實也擔心冬天到了  搞不好連狗都被偷去進補</p>
<p> </p>
<p> </p>
