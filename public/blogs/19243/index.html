<p>一直到昨天才拖著疲累的身體進戲院</p>
<p>之前想看是因為李冰冰</p>

<p> </p>

<p>基本上對片頭的老飛機劃過白雲的鏡頭比較有印象.  風聲二字化為雲絮.</p>
