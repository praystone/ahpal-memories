<p>      有天晚上，潔面後貼黃瓜
　　男友打來電話～</p>
<p>       我按掉，回短訊：寶貝兒～正貼黃瓜呢～嘴巴封住了～一會聊天吧
　　男友回：便宜那黃瓜了！告訴他那是我專利！
　　 我回：別鬧～貼黃瓜不能笑的！
　　男友回：好在它也姓黃，算了，不跟它一般見識拉～
　　我笑噴～貼在臉上的黃瓜全掉下～～～</p>
