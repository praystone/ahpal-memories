<p><strong>發文</strong>：2009-12-09</p>
<p><strong>瀏覽</strong>：39 次 ｜ <strong>回應</strong>：0 則</p>
<hr>
<p>一位夫人打電話給建築師，說每當火車經過時，她的睡床就會搖動。</p>
<p>「這簡直是無稽之談！」建築師回答說：「我來看看。」</p>
<p>建築師到達後，夫人建議他躺在床上，體會一下火車經過時的感覺。</p>
<p>建築師剛上床躺下，夫人的丈夫就回來了。
他見此情形，便厲聲喝問：「你躺在我妻子的床上幹什麼？」
建築師戰戰兢兢地回答：「我說是在等火車，你會相信嗎？」</p>
