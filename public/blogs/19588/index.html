<p>某一日&hellip;&hellip;
嘉祥沮喪的回家&hellip;&hellip;
對媽媽說: 媽&hellip;&hellip;我不想去學校啦!!!!!</p>
<p>媽媽說:為什麼呢???
嘉祥說:有兩個原因&hellip;..
第一&hellip;.同學們都不喜歡跟我玩&hellip;..
第二&hellip;.老師們也都對我很冷淡&hellip;..</p>
<p>媽媽回答:不行&hellip;你還是要去學校&hellip;..</p>
<p>也有兩個原因&hellip;&hellip;.
第一&hellip;.你已經五十歲了&hellip;..
第二&hellip;.你是校長&hellip;&hellip;&hellip;.</p>
