<p>在遠古的時候&hellip;
原本勢不兩立的天使和惡魔相戀了&hellip;(不要問我為甚麼&hellip;)</p>
<p>而不被祝福的天使和惡魔在結合後
生了很多很多的孩子&hellip;..
而這些孩子就是徘徊在天使和惡魔之間&mdash;叫做&quot;人&quot;的怪物~</p>
<p>這些怪物&hellip;.有的會上天堂&hellip;有的會下地獄&hellip;.
不生不死就留在一個叫做人間的地方自生自滅&hellip;.</p>
