<p>有一天</p>
<p>小沁和小燁一起玩盪鞦韆</p>
<p>小燁說:盪高 盪高</p>
<p>小沁聽成:蛋糕 蛋糕</p>
<p>所以特地拿了蛋糕給他</p>
<p>小燁說:拿蛋糕給我幹麻?</p>
<p>小沁說:你不是說蛋糕蛋糕?</p>
<p>小燁:我是說盪高 盪高</p>
