<p>從前從前，有三個好兄弟，老大叫做劉氓，老二叫做蔡刀，老三叫做馬煩。</p>
<p>有一天麻煩不見了，老大帶著老二急忙的到處找老三，可是卻怎麼找都找不到，於是老大便帶著老二去報警，進了</p>
<p>警察局便喊道：我叫劉氓(流氓)帶著蔡刀(菜刀)來找馬煩(麻煩)</p>
