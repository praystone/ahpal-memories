<p> </p>
<p>　　　　風花雪月如煙過</p>
<p>　　　　蠟炬火焰總有盡</p>
<p>　　　　瀰漫煙霧愁憂鬱</p>
<p> </p>
<p>　　　　魂魄無緣難重生</p>
<p> </p>
<p>　　　　只能身隨魂夢飛</p>
<p> </p>
<p>　　　　塵世難隨鎖心扉</p>
<p> </p>
<p>　　　　癡心夢醉恆河山</p>
<p> </p>
<p>　　　　萍水異景終似夢</p>
<p> </p>
<p>　　　　新人何曾記舊影</p>
<p> </p>
<p>　　　　荒山孤墳鳥啼飛</p>
