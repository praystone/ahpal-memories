<p>有一位神經病院的醫生問患者：&ldquo;如果我把你的一隻耳朵割掉，你會怎麼樣?&rdquo;</p>
<p>那位患者回答：&ldquo;那我會聽不到.&rdquo;
醫生聽了&hellip;.. &ldquo;嗯嗯&hellip;很正常.&rdquo;
醫生又問道：&ldquo;那&hellip;如果我再把你另一隻耳朵也割掉，你會怎麼樣?&rdquo;
那位患者回答：&ldquo;那我會看不到.&rdquo;
醫生開始緊張了：&ldquo;怎麼會看不到咧?&rdquo;
患者回答:
&ldquo;因為眼鏡會掉下來.&rdquo;</p>
