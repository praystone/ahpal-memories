<p>夏令營裡，老師要同學們去盥洗室洗手，並整理儀容，二十分鐘後接受撿查。
老師：大呆你的雙手洗得很乾淨，可是頭髮卻很零亂。
大呆：我真的已經梳過了。
老師：那麼你的頭髮為什麼那麼亂呢？
大呆：剛剛有那麼多人頭，擠在鏡子裡，我怎麼知道那個是我的頭。
老師：&hellip;&hellip;</p>
