<p>當農夫真的很辛苦</p>
<p>花了$2425元買石榴種子一顆</p>
<p>共收承2次  每次收貨量很小氣的才30顆</p>
<p>一顆更是摳的只能賣$54元</p>
<p>終其量總收入才$3240元</p>
<p>其中肥料錢大約要扣掉$300~$400</p>
<p>So&mdash;&gt;&gt;3240-2425-400=415</p>
<p>這是長期農作物   所花時間粉多</p>
<p>才賺這麼一丁點摳摳</p>
<p>真是&quot;農夫真辛苦&quot;</p>
