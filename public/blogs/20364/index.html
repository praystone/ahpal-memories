<p>地理考試時,
老師要學生簡略描述下列各地：
&quot; 阿拉伯、新加坡、好望角、羅馬、名古屋、澳門 &quot;
 
其中小明這樣寫：從前有個老公公,
大家叫他&quot;阿拉伯 &quot;
有一天他出去爬山
當他爬到&quot;新加坡&quot;的時候
突然看見一隻頭上長著&quot;好望角&quot;的&quot;羅馬&quot;直衝過來
嚇的他拔腿跑進&quot;名古屋&quot;, 趕緊關上&quot;澳門 &quot;</p>
