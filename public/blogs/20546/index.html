<p>某天晚上老王趁著小孩都去上補習班</p>
<p>想說難得只有夫妻倆在家獨處的&quot;美好時光&quot;</p>
<p>老王在房裡叫說:老婆我們幾點做愛阿~~</p>
<p>老婆在客廳看著電視大聲喊: 你說什麼阿~~</p>
<p>老王不厭其煩說: 幾點做愛阿~~</p>
<p>老婆大聲回道: &hellip;&hellip;&hellip;&hellip;.</p>
<p>早就換作&quot;娘家&quot;了啦&hellip;你還在作 &ldquo;愛&rdquo; 咧&hellip;.</p>
