<p>今天在小于的農場裡發生了二件喜事，令小于非常開心，因為開啟信箱發現了鮮花，真讓我又驚又喜是哪一位愛慕者呢？原來是我常常去光顧偷菜的好鄰居小魚兒和喜德送我美麗的鮮花，感謝二位大大不計較小女子入家門還帶走伴手禮的好習慣，還將二位辛苦摘種的鮮花送給我，在這裡要向二位深深鞠躬說聲：謝謝你～親愛的好鄰居，讓小于今天睡覺作夢都會笑～呵呵呵</p>
