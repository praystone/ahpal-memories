<p>百家姓中的各種姓氏在討論誰比較厲害…</p>
<p>趙：「我們趙姓是百家姓的第一位，所以是我們！」</p>
<p>陳林同聲說：「我們號稱陳林半天下，所以是我們！」</p>
<p>孫說：「中華民國的國父姓孫，所以是我們！」</p>
<p>這時姓廖的就哈哈大笑的說：「我的姓才是最偉大的，你們難道沒聽過（廖氏如神）嗎？」</p>
