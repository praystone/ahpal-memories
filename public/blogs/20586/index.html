<p>謝謝小蓁送給小于一個夢幻家園，讓小于在現實中無法實現的夢想，在這裡通通都實現了～</p>
<p>蓁是令人非常開心，希望小于有一天也能成為像小蓁一樣善心人，在這個虛擬的世界裡當上一位有錢</p>
<p>的田橋仔，再貢獻自己的財富與人分享哈～哈～哈～，同時歡迎大家有空都來參觀小于的新家唷！</p>
