<p>讓我們敲希望的鐘呀
多少祈禱在心中
讓大家看不到失敗
叫成功永遠在
讓地球忘記了轉動呀
四季少了夏秋冬
讓宇宙關不了天窗
叫太陽不西沖
讓歡喜代替了哀愁呀
微笑不會再害羞
讓時光懂得去倒流
叫青春不開溜
讓貧窮開始去逃亡呀
快樂健康流四方
讓世間找不到黑暗
幸福像花開放
(童聲)：讓我們敲希望的鐘呀
多少祈禱在心中
讓大家看不到失敗
叫成功永遠在</p>
