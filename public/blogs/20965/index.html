<p><strong>發文</strong>：2010-02-17</p>
<p><strong>瀏覽</strong>：31 次 ｜ <strong>回應</strong>：1 則</p>
<hr>
<p>一對姓孫的夫妻，老來得子，作丈夫的看到妻子幫他生了一個白白胖胖的男嬰，</p>
<p>激動的熱淚盈眶。</p>
<p>老先生一把抱起才剛剛出生的小嬰兒，一臉驕傲的對他說：</p>
<p>「孩子，我要你將來比國父孫中山先生還要強兩倍 ！」</p>
<p>於是這夫妻倆就幫他們的兒子取了一個很響亮的名字，叫作：</p>
<p>「孫串出 」</p>
