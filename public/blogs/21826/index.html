<p>相信每個人都有被狗吠的經驗</p>
<p>在街頭、或訪友的時候&hellip;.，有時連主人都管不住</p>
<p>那麼要怎麼樣讓狗安靜下來呢？</p>
<p>教各位一個好方法~</p>
<p> </p>
<p> </p>
<p> </p>
<p> </p>
<p> </p>
<p>當狗對你吠：汪  (  one  )</p>
<p>你就回：two</p>
<p>這個時候狗會因為無法回你  three</p>
<p>而慚愧的停止吠叫了</p>
