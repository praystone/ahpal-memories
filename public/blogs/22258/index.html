。 。 。 。
攀登高峰望故鄉
黃沙萬里長
何處傳來駝鈴聲
聲聲敲心坎
盼望踏上思念路
飛縱千里山
天邊歸雁披殘霞
鄉關在何方
&mdash;Music&mdash;
風沙揮不去印在
歷史的血痕
風沙飛不去蒼白
海棠血淚
黃沙吹老了歲月
吹不老我的思念
曾經多少個今夜
夢迴秦關
夢迴秦。 。關。 。 。 。</p>
