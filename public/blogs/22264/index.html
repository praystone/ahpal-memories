<p>丁文琪 - 春倒</p>
<p>每年冬天
你說遺憾的是見不到雪
現在你了了心願
是什麼感覺
這個冬天
我的遺憾是沒你在身邊
取笑我寫的對聯
搶著要幫我重寫
你的消息 曾有人提起
原諒我那天 沒勇氣 去送你
你去年幫我寫的春字還在
說要貼倒了 春天就來
我去年幫你拍的相片還在
每天都反著擺
希望早一天等著你回來</p>
