<p>有一次，到朋友家，和朋友聊天，
她六歲的女兒總在我們談話中叨擾媽媽，朋友生氣的對女兒說：
「人家在說話，你這樣真的很不懂禮貌，我不再理你了，以後不要再叫我媽媽了！」</p>
<p>這句話真的起了很大的作用，小女孩果真不再吵鬧。
過了一會兒，小女孩拉拉媽媽的衣袖說：「陳太太！我可以喝杯水嗎？」</p>
<p>────《「純真」像潺潺的清流，洗濯我們的心靈＞&mdash;&mdash;-</p>
