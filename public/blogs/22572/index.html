<p>剛去離家近 菜市場買東西  買一份蔥油餅  
也順便買菜回家煮
再找菜時，  很好笑！！！
頭家娘， 剛好在花椰菜削皮時 
 說了一句話？</p>
<p>「妹妹 ， 這花菜一包30 、要不要？！」</p>
<p>我再心裡 os說：
暇密 買花菜 
我家在賣花菜辣  買會去互投嗎？
如果把花菜買回家 會不會發生什麼事呢！
也可能會趕出門吧！！
 
 </p>
