<p>有一天，小明弄壞了媽媽的手機</p>
<p>媽媽很生氣的說：小明，你去給我到佛堂反省，等佛祖說 OK 才能下來！</p>
<p>之後媽媽就出去買菜了&hellip;</p>
<p>媽媽走到一半發現忘記帶錢，於是跑回家…</p>
<p>打開門發現小明坐在沙發上看電視，</p>
<p>媽媽就生氣的說：小明，佛祖有說OK嗎？</p>
<p>小明就說：有啊，妳自己上來看！佛祖他還跟我比兩個OK呢！</p>
<p> </p>
