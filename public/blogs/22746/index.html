    <div class="blog-content"><p><strong>作者</strong>：KENJI</p>
<p><strong>發文</strong>：2010-04-27</p>
<p><strong>瀏覽</strong>：12 次 ｜ <strong>回應</strong>：6 則</p>
<hr>
<p>今夜的月兒不會圓  星兒不會亮</p>
<p>淚眼汪汪 心慌慌</p>
<p>說不出的空虛 道不出的寂寞</p>
<p>問蒼天</p>
<p>我與何人不同?</p>
<p>帶著同樣想愛的心看待</p>
<p>能給予的卻只有不安</p>
<p>無奈</p>
<p>找不到出口</p>
<p>懂我請抱緊我</p>
<p>愛我請別輕易說放手</p>
<p>心是如此荒涼</p>
<p>愛是如此深切</p>
