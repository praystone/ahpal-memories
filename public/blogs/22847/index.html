<p> </p>
<p>今天起我們</p>
<p> </p>
<p>決定不會在吵架了</p>
<p> </p>
<p>爲了沒有淚水</p>
<p> </p>
<p>沒有悲傷的喜悅之日</p>
<p> </p>
<p>也爲了眼前充滿著的幸福</p>
<p> </p>
<p>暫時將妳的笑容借給我</p>
<p> </p>
<p>在這美妙的世界裡</p>
<p> </p>
<p>妳就是我最好的禮物</p>
<p> </p>
<p>和我一起</p>
<p> </p>
<p>妳會發現一切不單是夢</p>
<p> </p>
<p>讓我們一起  留下感動</p>
