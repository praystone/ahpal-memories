    <div class="blog-content"><p><strong>作者</strong>：奮鬥小蓁</p>
<p><strong>發文</strong>：2010-05-16</p>
<p><strong>瀏覽</strong>：198 次 ｜ <strong>回應</strong>：26 則</p>
<hr>
<p>曾經有個男性友人唱歌很像洪榮宏</p>
<p>當時真的很欣賞他</p>
<p>我承認很自己喜歡懂得唱歌的男人</p>
<p>因為我自己也喜歡唱歌</p>
<p>奈何世上知音難尋</p>
<p>往往你愛人,別人卻不愛你</p>
<p>愛你的,你又不愛他</p>
<p>這就是感情上可悲的地方</p>
<p>相信每個人都有一個最愛的人</p>
<p>也有一個最愛你的人</p>
<p>祝福大家都能跟最愛或是愛你的人在一起</p>
