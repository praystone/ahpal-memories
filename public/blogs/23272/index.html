<p>昨日下班回家的路上，經過了東海，那一路上的夜景映入眼簾，心裡多了些愁悵&hellip;</p>
<p>有點酸澀，摻雜一丁點兒苦味。</p>
<p>腦海裡浮現了種種回憶，像是看一部電影，被按了快轉鍵，一幕幕快速閃過，</p>
<p>每一個階段，當時的人、事、背影，層層重疊&hellip;..</p>
<p>那些都是真實發生過的事，根本洗不掉啊！</p>
