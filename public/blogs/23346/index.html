<p><strong>發文</strong>：2010-05-27</p>
<p><strong>瀏覽</strong>：113 次 ｜ <strong>回應</strong>：3 則</p>
<hr>
<p>＊午夜的城市街頭　熱鬧的霓虹閃爍　為什麼內心裡只有虛空
　自從你走進生活　日子越來越寂寞　難道是因為愛　才讓我忘記了灑脫</p>
<p>＃曾經我為你寫的歌　是否你還記得
　那麼真實的溫柔　能否持續到以後</p>
<p>△如果你真的在乎我　請不要在人多的時候
　用笑聲解釋我只是朋友
　如果你真的在乎我　請不要在獨處的時候
　那麼無所謂讓我握著手　卻不說愛我</p>
