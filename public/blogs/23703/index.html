<p>這是一個嵌有螺旋溝槽的金屬器具，
該產品高92毫米，直徑為160毫米。材料為鋁。</p>
<p>這其實是一款飲料冷卻器緄緀綡綰，蜴蝂蜭蜩平時只要將它放在冰箱裡面，而需要冷卻飲料的時候則只要將飲料從上面倒入即可瘈瘑瘧瘉，墁境墇墑等到飲料沿著漫長而曲折的引水槽流下來時，你就可以享受到冰涼美味的飲料了。
