    <div class="blog-content"><p><strong>作者</strong>：KENJI</p>
<p><strong>發文</strong>：2010-06-25</p>
<p><strong>瀏覽</strong>：22 次 ｜ <strong>回應</strong>：2 則</p>
<hr>
<p>無論是嘗試還是真摯</p>
<p> </p>
<p>向前跨越如同競賽一般</p>
<p> </p>
<p>不同於以往的是不僅喜歡</p>
<p> </p>
<p>夢想將來記憶能長存妳心頭</p>
<p> </p>
<p>不知不經不覺中</p>
<p> </p>
<p>為此生此世此時</p>
<p> </p>
<p>埋下愛苗  像似紋身烙了印</p>
<p> </p>
<p>愛的太快還是太慢</p>
<p> </p>
<p>將愛添上魔咒</p>
<p> </p>
<p>感覺將永遠存在</p>
<p> </p>
<p>春去秋來</p>
<p> </p>
<p>經過幾次變換</p>
<p> </p>
<p>情仍從未變更</p>
