<p>近日老婆的公主病又來了，
半夜１２點，突然聽到老婆的手機在想，好心拿給老婆接．</p>
<p>這一接才知是　久未聯絡的朋友打來的，
我們夫妻對她的印象超不好，總是有目的才會跟朋友接觸．</p>
<p>老婆掛上電話則一直怪我，為何要把電話給她．　　</p>
<p>冤枉啊！　　我那知道是誰打來的．</p>
