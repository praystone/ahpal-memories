<p>我的小表弟．家裡的小惡魔，國小畢業了．　</p>
<p>他考試，我辛苦．　
舅媽要我們幫忙出考題．　
還要排版呢，比照講義辦理．　</p>
<p>庆幸他畢業了，我的伴讀工作，也告一段落了．　
功課之多，伴讀有時寫到半夜還沒寫完，一早又要爬起來寫．</p>
<p>重温國小的功課，有些忘了，不會還要假裝會．　絶不能被看扁．</p>
