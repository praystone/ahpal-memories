<p><strong>發文</strong>：2010-07-18</p>
<p><strong>瀏覽</strong>：16 次 ｜ <strong>回應</strong>：1 則</p>
<hr>
<p> </p>
<p>春江秋月  落葉風中飛
昏昏暗暗的燈火  對影飲酒乾一杯</p>
<p>愛是啥貨   甘是相欠債
難忘句句的情話 親像放惦心肝內底
女人的一生中  付出不惜代價
堅心對著所愛的一生一世
 
女人的青春啦  因為愛才美麗
那通無情的人  挽花落地
渣埔人講的話  十分有九分假
為愛變甲沒魂無體</p>
