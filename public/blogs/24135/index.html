<p>光明與黑暗？希望與曙光？
何者黑暗？何者光明？
誰創造了世界？誰又顛覆了世界？
夢的延續，生命的延誕，
刀殘過江龍，兩相不落欠，
熇炎兩筋插，落雁迴峰間，
鋒銘醉相劍，心技別納天！</p>
