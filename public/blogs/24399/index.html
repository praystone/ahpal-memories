<p> </p>
<p>推開一片天</p>
<p>伸出手的妳　是夏日時分</p>
<p>希望你能來</p>
<p>能來到這水邊</p>
<p>要給妳一朵蓓蕾</p>
<p>庭院的花蝴蝶</p>
<p>為妳紛飛</p>
<p>桃紅色的可愛的妳</p>
<p>揚起白色的帆</p>
<p>追逐著輕盈的蝴蝶</p>
<p>祈願無盡的波瀾完全的</p>
<p>靜止下來</p>
<p>但願無邊無際的夢想</p>
<p>終有一日</p>
<p>一定</p>
<p>會開花結果</p>
<p>與心愛的人兒</p>
<p>比翼雙飛</p>
