<p>一位男子到圖書館借書，他問圖書館的女職員:請問&quot;幸福的婚姻生活&quot;這本書放在哪裡？
女職員:是科幻小說，到右邊第三排的櫃子上去找。
男子:那麼&quot;夫妻相處之道&quot;這本書又放在哪裡呢?
女職員:是武俠小說，到左邊第一排的櫃子上找吧!</p>
