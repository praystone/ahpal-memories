<p>很久沒吃炸物了
今天
麻吉們
為了怕我在&quot;獄中&quot;
吃不到肯得雞
特地買了幾筒全家餐
真的是
太感動了
在此立上感謝狀
其中一個
要求打破吃整筒傳說
自己買了一筒9塊雞全家餐
只看見
他倒地了
還剩2塊
薯條2包
1大罐可樂
只能說
傳說
依舊是傳說&hellip;</p>
