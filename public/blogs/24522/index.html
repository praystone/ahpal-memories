<p>我長久以來是他的書迷</p>
<p>每次他的書看完之後總會讓人有一種感悟</p>
<p>他已經寫完這本書很久了</p>
<p>但每次看總不會令人厭煩</p>
<p>雖然是個悲劇</p>
<p>但這卻是很活生生的例子</p>
<p>告訴我們人不是無敵的</p>

<p>像故事中的例子不是不可能發生</p>
