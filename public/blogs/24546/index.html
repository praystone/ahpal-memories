<p>在軍中
渡過了十餘天的日期
在今天
懇親會到了
規定
每個人
都在寢室等待中
當叫到號碼時
宿舍的每個人
都大聲歡呼
因為
家人到了
可以領出來
吃東西
帶著逛營區
真的
很開心
因為我可以回家
玩<del>電</del>腦<del>了</del></p>
