<p>相同情況，但是表現大不相同．</p>
<p>事情找我時 - 我好在意，苦苦相逼． ／你的反應是要我反應不要太大．　　</p>
<p>事情找你時 - 我極力撇清，要你不要在意．／你不說話．</p>
<p> </p>
<p>二個人的生活可以無憂無慮。</p>
<p>但加入家人的生活，可就一堆意見。。。。無力感出現。</p>
<p>抗議無效。。。</p>
