<p>這次回來
趣事
依舊不斷
雖然
也有不開心的時候
但
總算
結束了
這
37天的
新訓
(好像實際只有31天???)
在離營時
外面
等著車子
接送著
這時
看著別的車子
載著
其他連隊的
弟兄
還揮著手
心中
真是無名火
很有
比中指
的fu
剛這樣想時
隔壁連的
已經
比出來了
看樣子
有人
跟我
是一樣的
感覺</p>
