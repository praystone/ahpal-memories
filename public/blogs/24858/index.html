<p>會場佈置的還不錯</p>
<p>蠻有質感的　有用心哦</p>
<p>看著妳的婚紗紀錄片</p>
<p>看著妳步上紅毯</p>
<p>看著妳對爸媽鞠躬道謝</p>
<p>真的是很感動的一刻</p>
<p>不知不覺偷偷流了一點小淚</p>
<p> </p>
<p>雖然曾經是那麼的不愉快</p>
<p>但妳遇到珍惜妳的人　愛妳的人</p>
<p>臉上洋溢著幸福的表情</p>
<p>要一直甜蜜的過下去哦</p>
