<p>浮世滔滔 人情渺渺
一劍飄飄 一生笑傲
傳一曲天荒地老
共一生水遠山高
正義不倒
會盟天下英豪
無招勝有招
英雄肝膽兩相照
江湖兒女日見少
心還在，人去了
回首一片風雨飄搖</p>
