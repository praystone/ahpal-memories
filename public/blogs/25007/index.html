    <div class="blog-content"><p><strong>作者</strong>：偉哥</p>
<p><strong>發文</strong>：2010-10-10</p>
<p><strong>瀏覽</strong>：66 次 ｜ <strong>回應</strong>：2 則</p>
<hr>
<p>這是一隻神奇的母雞</p>
<p>是江蘇省金湖縣新港碼頭處漁民所飼養</p>
<p>站立和行走的樣子都和企鵝一樣</p>
<p>在眾同類中，趾高氣揚，頗有「鶴」立雞群之勢。</p>
<p>據說這隻母雞小時候剛學走路就顯得與眾不同、怪模怪樣</p>
<p>如今長大了，果然成「才」。</p>
<p>不過由於不會飛，其它雞晚上回雞窩都會飛到高架上</p>
<p>而它只能呆在地上。</p>
<p> </p>
