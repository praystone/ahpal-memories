<p> </p>
<p>還帶我去台北玩，順路去找外公</p>
<p> </p>

<p> </p>
<p>可是外公說：他想馨馨的時候就可以打這支手機給馨馨了</p>
<p> </p>
<p>現在馨馨有手機了，讓人心情好的不得了</p>
