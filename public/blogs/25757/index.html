<p>在一個孤島裡，只有兩個人，沒有第三個人</p>
<p>一個人是賣麵的老闆</p>
<p>另一個人則是都會去麵攤吃麵的人，每餐都固定吃一碗</p>
<p>一碗麵賣10元</p>
<p>只賣一種陽春麵，不賣其他東西</p>
<p>請問這個老闆要如何增加他當天的營業額?</p>
<p>以下4點不可犯</p>
<p>1.不准漲價</p>
<p>2.不賣任何魯味</p>
<p>3.不准有任何活動促銷</p>
<p>4.不准偷工減料</p>
