    <div class="blog-content"><p><strong>作者</strong>：小米</p>
<p><strong>發文</strong>：2010-12-01</p>
<p><strong>瀏覽</strong>：181 次 ｜ <strong>回應</strong>：22 則</p>
<hr>
<p>我情無相回，</p>
<p>為你枉葬心。</p>
<p>何來此情愁，</p>
<p>而伴輪迴生。</p>
<p>來生以未識，</p>
<p>佛境再相尋。</p>
<p>前程無相伴，</p>
<p>還約無相期。</p>
<p>心念佛前停，</p>
<p>願君勿還心。</p>
<p> </p>
<p>我看到亞莉去頂了這顆星星，所以來解釋一下，</p>
<p> </p>
<p>這首詩 佛前還心 是，我為何而來，佛前還心願。的意思，</p>
<p> </p>
<p>不是葬心的意念喔　︿　︿＂謝謝亞莉這麼關心我。</p>
<p> </p>
