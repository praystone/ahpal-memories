<p>終於在昨晚離開台北告別父母</p>
<p>又跟老公回到台中</p>
<p>好久好久沒有那個莫名的感覺</p>
<p>好久好久沒有認真的看著父母親的臉龐</p>
<p>忽然在霎那中發現那歲月的痕跡越來越多</p>
<p>但是那慈愛的眼神與關愛的心依舊不變</p>
<p>原本只想要好好的在家中多住幾天</p>
