<p>歌曲：出塞曲
歌手：張清芳
製作：
 
請為我唱一首出塞曲用那遺忘了的古老言語
請用美麗的顫音輕輕呼喚我心中的大好河山
那隻有長城外才有的清香誰說出塞歌的調子太悲涼
如果你不愛聽那是因為歌中沒有你的渴望
而我們總是要一唱再唱像這草原千里閃著金光
像這風沙呼嘯過大漠像這黃河岸吶印山崗
英雄騎馬壯 騎馬榮歸故鄉</p>
