<p>一輪銀月映湖景.二對鴛鴦影相隨
三更露華寒風起.四目凝望語深濃
五里煙裊相思寄.六角亭院倚秋荷
七夕纏緜鵲橋長.八面玲瓏香郁佛
九斛太液醉今朝.十載離分思成濤
十一柏峰繁星樓.十二樂章譜琴合
百般溫存意重逢.千凡仙履尋君顏
萬念不灰終願酬.億愛兆戀永世重</p>
<p>蕭老頭75人&hellip;&hellip;</p>
