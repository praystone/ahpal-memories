<p>一撫雙鬢三生緣.四更五音六合絃
七律八思九紫化.十方長虹百世延
千星斗耀凡塵夢.萬籟春吟仙閣泉
億詩風流柔情艷.兆盈滿綴乾坤聯</p>
<p>賦筆長雲柔似水.妍儀妤韻對瓊芝
香羅疊曲嬌微靨.舞轉薰檀一片詩</p>
