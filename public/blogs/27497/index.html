夢醉玫瑰花下情綿延 彩光萬紫絮婉婷 七絃韻律醉瓊瑤</p>
<p> </p>
<p>身巧硯墨當枕 托佩靈劍打頓 夢醉呢喃惹憐

<p> </p>

親親我的魚 枇杷膏提去飲 書桌電火愛乎光 唱歌讀書我奉陪</p>
