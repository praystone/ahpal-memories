<p>晴 一日清
霢雨與寒流 讓出一日溫暖的情
北濱難得六小時波平雲輕
明 一世情
思念與等待 化出一世夢裡的卿
南鄉寄身六小時神隱魂傾</p>
<p>迴 昨夢寐
思念的紡錘 打不醒縱情的迷醉
只留下千詩相對句句心碎
淚 為君墬
忘了我是誰 相思斷腸一同交杯
只盼摘星攬月戀戀的依歸</p>
