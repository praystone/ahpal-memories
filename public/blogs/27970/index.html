<p>100年除夕，中視製作了一個除夕特別節目，並邀請到劉謙來節目現場變魔術~
此影片為其中一樣魔術</p>
<p>大陸央視在兩年前邀請台灣魔術師劉謙上春晚後，掀起了一股魔術熱，劉謙今年­除夕回台灣演出，大陸央視則找來台灣幻影魔術師丁建中跟大陸魔術師傅琰東PK，讓兩岸­除夕節目都大玩魔術秀。</p>
