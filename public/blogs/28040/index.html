<p><strong>發文</strong>：2011-02-10</p>
<p><strong>瀏覽</strong>：22 次 ｜ <strong>回應</strong>：1 則</p>
<hr>
<p>歸鳥下。遊雲別。倆靜與宵零。不戀金銀華屋。但求樹鬱樵耕。
蝶去蝶來停。帶春端、飛序時醒。歲流蒼翠朱秋白。還是懷卿。</p>
<p>春媚送。梨花語。郁醉月身黃。點絳朱唇慵懶。引君共倚西窗。
不覺蝶來相。這般如、仙境鴛鴦。只愁時沒初光遣。情淚難藏。</p>
