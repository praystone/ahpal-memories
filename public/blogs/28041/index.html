<p>《話酉》
藏詞欲吐獨跚跚。這雨潸潸。漭漭沉雲不盡煩。卒呼去、沒今寒。
凡塵兩字孤單。似曾夢、懷情見難。酒藉夜來纏。明眸於我。一抹唇丹。</p>
<p>《畫牖》
風梳細雪挑冰弦。這淚潸潸。可教春痕落曲殘。葉離色、任愁煩。
芳華夢過猶單。似無解、癡深也難。思字且來纏。孤搖微燭。又把情穿。</p>
