<p>世界上最無法強求的事，就是走向某個人的那顆心！比它更不受控制的就是～走向某個人那裡後卻不肯回來的那顆心！嘗試接納另一顆心來填補空缺的心房，卻沒想到那位房客一直沒有搬走，而心也一直留在某個人的那裡回不來。教教我，該如何把心帶回來～</p>
