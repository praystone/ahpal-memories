<p>某天&hellip;.老師一進教室就問說：「誰覺得自己是班上最醜的請站起來&hellip;.」
一會兒，班上最聰明ㄉ同學站ㄌ起來。
老師就問：「你覺得你是班上最醜ㄉ，真的嗎？」
這位學生回答：「不！老師，我只是不忍心，你一個人站在那&hellip;&hellip;..」</p>
