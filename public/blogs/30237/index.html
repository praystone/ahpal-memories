<p>《班扎古魯白瑪的沉默》</p>
<p>你見，或者不見我</p>
<p>我就在那裏</p>
<p>不悲不喜</p>
<p>你念，或者不念我</p>
<p>情就在那裏</p>
<p>不來不去</p>
<p>你愛，或者不愛我</p>
<p>愛就在那裏</p>
<p>不增不減</p>
<p>你跟，或者不跟我</p>
<p>我的手就在你手裏</p>
<p>不捨不棄</p>
<p>來我的懷裏</p>
<p>或者</p>
<p>讓我住進你的心裏</p>
<p>默然　相愛</p>
<p>寂靜　歡喜</p>
