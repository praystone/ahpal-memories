墨雲千疊浪捲，


&nbsp;


風鳴舞破疏煙。


&nbsp;


寒夜孤衾已難眠。


&nbsp;


任由瞬落珠圓。


&nbsp;


&nbsp;


覺來初日含山，


&nbsp;


圓荷瀉露飛燕。


&nbsp;


淡淡梳妝愁眉斂。


&nbsp;


一點香檀飛煙。


&nbsp;


&nbsp;
