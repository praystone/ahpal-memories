請再看
再看我一眼
在風中　在雨中
再回頭凝視一次
我今宵的容顏




請你將此刻
牢牢地記住　只為
此刻之後　一轉身
你我便成陌路


悲莫悲兮　生別離
而在他年　在
無法預知的重逢裏
我將再也不能
再也不能　再
如今夜這般的美麗
