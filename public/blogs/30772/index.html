<p>張老師在批改英語作文，忽然大發雷霆：「我從來沒看過這麼爛的英語作文。」李老師見狀問：「寫的是什麼啊？」
張老師：「寫一個王子和公主的故事。」
李老師：「不錯啊！」
張老師：「他竟然在開頭寫王子問公主：『Can you speak Chinese？』」
公主回答：「Yes！接下來的全部都是中文。」</p>
