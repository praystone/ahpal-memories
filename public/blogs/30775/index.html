<p>一天，小王和妻子一起看電視新聞。電視新聞上有一則報導：「據調查，男人中有70%希望有一次婚外情。」
小王忙向妻子解釋道：「我是另外那30%當中的！」
話音剛落，電視新聞裡繼續報導：「另外的30%希望有多次婚外情！」</p>
