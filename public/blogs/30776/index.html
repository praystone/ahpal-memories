<p>老王在某單位工廠工作。一日，他的妻子來看望他，無意中發現單位裡的人都是近視眼。
妻子便說：「怪了，你單位的人怎麼個個都戴眼鏡的？」
老王回答：「這有什麼奇怪的，人家個個都是有學問的人，整天和書本打交道嘛！」
「哦！我明白了，怪不得你工資這麼低，原來是你沒戴眼鏡的原故！」老王妻子恍然大悟道。</p>
