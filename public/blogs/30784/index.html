<p>有一天，媽媽和小芬在看電視，新聞正報導一個可憐的女孩。媽媽：「這個女孩真可憐，她失去了親愛的爸爸，又失去了心愛的狗狗。
小芬，妳願不願意把你的狗狗送一隻給她呢？」
小芬：「那……不如……我們把爸爸送給她吧！」 
媽媽：「……」！</p>
