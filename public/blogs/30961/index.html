<p>語文老師在講台上很有表情地為大家讀了一首題為「臥春」的詩，要大家寫在筆記本上：</p>
<p>《臥春》</p>
<p>暗梅幽聞花　臥枝傷恨底　遙聞臥似水　易透達春綠。岸似綠　岸似透綠　岸似透黛綠。</p>
<p>沒想到一位同學的筆記竟然是這樣寫的：</p>
<p>《我蠢》</p>
<p>俺沒有文化　我智商很低　要問我是誰　一頭大蠢驢。俺是驢　俺是頭驢　俺是頭呆驢。</p>
<p> </p>
