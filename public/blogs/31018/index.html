<p>有些人
你以為可以見面的
&hellip;..
有些事
你以為可以繼續的
&hellip;..
但也許就在你轉身的那一剎那
有些人
你就再也看不到了
&hellip;..
有些事
也就不能再繼續了
&hellip;..
當月亮升起
繼而又落下的時候
&hellip;..
一切都變了
也許
&hellip; &hellip;
就再也回不去了
所以
&hellip;
學會珍惜
&hellip; &hellip;</p>
