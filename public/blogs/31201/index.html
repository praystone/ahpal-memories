<p>學外語</p>
<p>黑夜裡，老鼠爸爸帶著老鼠兒子逛街，遇上幾隻老鼠強盜。
老鼠爸爸急中生智，學了一聲貓叫，因為裝得太像，把老鼠強盜嚇得鼠竄而去。
「看吧！」鼠爸敲敲鼠子的頭：「早告訴你，要學外語，你看看，管用吧！」</p>
