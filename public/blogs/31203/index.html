<p>                問不停</p>
<p>        某百貨公司三樓的收銀台常被人當成「詢問處」，收銀小 姐就覺得不勝其煩。
　　她便想到一個妙計，在台子上放了一個「這是收銀台，不是詢問處」 的牌子。
　　結果，很多顧客還是來問收銀小姐：「請問詢問處在那裡？」</p>
