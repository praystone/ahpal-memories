<p>軍校的兩個男性新生站在軍人福利社門口，一位漂亮的女軍官迎面走來。兩位新生他們目不轉睛地盯著女軍官看，誰也沒注意到她的官銜。」
女軍官問：「你們見了長官為什麼不敬禮？難道你們沒看到我的肩章嗎？」
一位新生答：「報告長官，我們還沒看到那裡呢。」</p>
