<p>導演：「你以為這個劇本如何？作曲方面有些什麼設想？」作曲：「劇情平淡，對話太多……」
導演：「老兄，就靠你音樂幫忙了，來點歡樂明快的樂曲！」
作曲：「重要的是最後必須是進行曲和女高音獨唱。」
導演：「為什麼？」
作曲：「不然，觀眾都睡著了，無法離場。」</p>
