<p>秋別
命七天的意中人，兩人於碧水嶺邂逅，墜入愛河，就此金盆洗手隱退江湖。無奈武林風波不止，為練成菩薩印第十式解救蒼生，在崎路人的指點下，秦假仙登門求助命七天，蔭屍人更是暗中毒殺秋別，佳人香消玉殞，讓命七天哀莫大於心死。</p>
