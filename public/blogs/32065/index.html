<p>寒夜殘燈
天蝶盟二當家，手提殘燈，貌似照世明燈，初時身分成謎，被懷疑是照世明燈及千里不留行。心性良善，盡心於武林和平，因背叛天蝶盟，被迫喝下三杯毒酒，遭追殺逃入霧谷。事後再度復出，死於天禍妖狐之手。</p>
