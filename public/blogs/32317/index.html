<p>如何成為一個有品味的人呢？「品味」二字給人的感覺是有質感、有生活品質、懂得享受人生的人，而不懂得「品味」的人，可簡單解釋為沒品的人，相信被人笑稱沒品的人，必定覺得不是滋味，而「沒品」的人，一般就是我們印象中的缺乏品德、品性操守不良的人；所以，想要有一個有品味的人生，就應該先從注意公德心、重視為人操守做起才是根本之道。</p>
