<p>如果
哭能讓妳好過 那就縱情哭一哭
若一次不夠 那就痛哭再一次次
直到妳認為夠了 夠讓自己重生
那就是到頭 就撥黑雲見晴天了
人生沒有跨不過坎 過不了的關

水太深 那就學會游泳就能過了
石太硬 那滴水久了也能破石的</p>
