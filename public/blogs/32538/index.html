<p>過去總讓人感到一陣心悸　　那人走了，　　只是路過你的生命而已。　　　　　　你身旁的風景即使如畫，　　可沒了那人，沒了你心中最疼愛的人，　　始終是張黑片。　　　　　　他在你心裡，你沒辦法忘記，　　或許只是一句之於離別的承諾和用以慰藉的誓言。　　　　　　當再以看到他與另一人，　　你的心，　　到底有多痛&hellip;</p>
