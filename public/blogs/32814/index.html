    <div class="blog-content"><p><strong>作者</strong>：紫盈</p>
<p><strong>發文</strong>：2011-03-21</p>
<p><strong>瀏覽</strong>：57 次 ｜ <strong>回應</strong>：4 則</p>
<hr>
<p>不管在外面受了多大的委曲</p>
<p>不管在外面是否有人讓自己生氣</p>
<p>不管在外面是否難過 傷心</p>
<p>ㄧ回到家裏</p>
<p>所有的負面情緒全都被我拋之腦後</p>
<p>我不再感到生氣 難過</p>
<p>只會覺得全身放鬆</p>
<p>把心中的ㄧ切負面情緒放下</p>
<p>覺得安心</p>
<p> </p>
<p>我想~</p>
<p>這就是人家說</p>
<p>〝家，是自己永遠的避風港〞的原因之ㄧ吧!</p>
