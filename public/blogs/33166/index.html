<p>    人生不如意之事常十之八九，這是我們常聽到的一句話；但會說這句話的人，應該也是屬於凡是悲觀的人吧！我們也常說，凡事要從另一個角度去看，要快樂、要痛苦，往往只在一念之間，人生難免會遇到生命的高、低潮，但記得，當低潮來臨時要想想人生還有許多的高潮等著我，也要記得不要讓低潮將自己輕易擊倒。</p>
