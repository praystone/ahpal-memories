<p> </p>
<p>隱藏深處的黑色翅膀急於衝出</p>
<p>揮動著慣有的深灰色悲傷淚珠</p>
<p> </p>
<p>隨著舞動的次數</p>
<p>灑落越顯的鮮明
　</p>
<p>搖墜彼此存在感中</p>
<p>無法揮之毀滅傷痛　</p>
<p> </p>
<p>絕望如鉛沉襲擊而來</p>
<p>孤獨與不安如覆薄冰</p>
<p> </p>
<p>擅自編織的夢中童話</p>
<p>彷彿如生鏽般的剝落</p>
<p> </p>
<p>櫻花底下的粉紅色</p>
<p>何時再現你我心中</p>
<p> </p>
<p> </p>
