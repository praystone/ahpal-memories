<p>這是我第一次，在這麼大的太陽底下，竟然不會覺得熱，
反而做的渾然忘我，工作完後心中暗自竊喜，
這是我有史以來可以跟太陽和平相處的一次。</p>
<p>當下的我，的確非常認真的撿著石頭，一顆一顆的撿，
心中竟然沒有任何的雜念，只是當下專注的在撿石頭。
現在回想起來，真的感到不可思議。……</p>
