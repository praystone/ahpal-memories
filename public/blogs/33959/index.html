<p>當人人都充滿自信，你肯定自我，他也肯定自我，會不會發生「一山不容二虎」的情況？變成老虎咬老虎了？</p>
<p>絶對不會的，能夠肯定自我的人，一定也能夠尊重別人。他會知道事情應不應該做，也會考慮到別人有自己的立場，有自己的想法，所以他一定會尊重別人。</p>
