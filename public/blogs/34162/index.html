<p>帝如來佛首男雲鼓雷峰之首招提僧三身果報自凡根，六界因緣無了痕。
善逝從來非本相，枯榮生滅渡空門。霹靂經武紀之梟皇論戰 第26集賢劫殿一頁書雲鼓雷峰光世大如、法丈輪王、聖彌陀、無惑渡迷、斷業捨妄、拔苦刑招初禪三式「菩提之間、輪迴之末、涅槃之初」、吾佛照燈印、金剛薩埵卍蓮懺、禪海雷音佛刑禪那</p>
