<p>美國職棒大聯盟MLB德州遊騎兵（Rangers）先發投手韓特（Tommy Hunter），由於拉傷右鼠蹊部肌肉，至少缺賽6周，恐怕趕不上開季。</p>
<p>韓特2009年也曾因為鼠蹊部傷勢缺賽10周，他說，這次應該不會那麼久。</p>
<p>韓特上季先發22場，戰績13勝4敗。</p>
