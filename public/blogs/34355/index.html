<p>拂櫻齋主男凱旋侯嬌蘭傲梅世人賞，卻少幽芬暗裡藏，
不看百花共爭豔，獨愛疏櫻一枝香。霹靂震寰宇之刀龍傳說 第32集四魌界拂櫻齋楓岫主人、極道先生火宅佛獄小免無執相、白塵子 (副體)九天櫻華、沖櫻流旋、四葉掌櫻、雪櫻千放、百嫣初放、縛神滅殺、飛櫻吹雪、千櫻吹雪、雪櫻千里、寒羽綻華、九櫻曼天羅、雪櫻舞天</p>
