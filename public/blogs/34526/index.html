<p>地冥至尊
滅輪三界者，肩負驅逐三途判的天命，生有一子燕渡關，卻因與輔天不合，反對燕渡關與輔天之女佛蓮交往。後因好友賽遷死前託付，讓地冥至尊與輔天不計前嫌，三界者再度攜手合作，入苦境殺除三途判。</p>
