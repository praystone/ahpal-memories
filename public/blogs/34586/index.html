<p>就好比當我們專心做一件事時心無旁鶩，
根本就不會想到其他的事，煩惱自然不升。
與其煩惱地球毀滅，
不如問自己今日有做好本分嗎?!
有照顧到自己的內心嗎?!
有關心自己愛的人嗎?!</p>
