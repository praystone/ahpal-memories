<p><strong>發文</strong>：2011-03-28</p>
<p><strong>瀏覽</strong>：20 次 ｜ <strong>回應</strong>：0 則</p>
<hr>
<p>許多人誤解不執著的真義，把它當成不上進的藉口，
人家往上爬，
自己不一定要往上爬。
例如有人得意洋洋地說：
「做董事長有什麼了不起，他吃飯睡覺，我也一樣吃飯睡覺。」</p>
<p>人人都在努力求進步，自己卻自暴自棄，
還說是不執著、放得下，這是一種自卑、懦弱的不健康心態。
他們沒有想到，人可以經由學習而不斷成長。</p>
