<p>巴比倫首富阿卡德認為，每個人都要有工作，擺脫貧窮的第一個方法是，工作的全部收入中只花十分之九，至少要保留十分之一儲蓄，長期累積。「學習讓你所賺取的金錢替你賺錢。讓它成為你的奴隸，讓它的世代子孫也替你賺錢。」</p>
