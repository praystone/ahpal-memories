<p>我們無法用薪資滿足我們的所有慾望，因為人有太多的慾望。在還沒成為有錢人之前，要克制內心的物質「慾望」，只花「必要花費」。必須「算準你的花費，在不動用超過收入的十分之九限額內，去負擔日常必需的開銷、享樂以及滿足值得滿足的慾望。」</p>
