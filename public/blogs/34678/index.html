<p>「在拿出你的財富投資前，要好好的研究，要確保它會回到你的錢包裡。」世間並沒有快速致富的捷徑，「不要太相信自己的聰明才智……最好去問那些在理財方面有經驗、有智慧，並懂得如何幫你賺取利潤的人。」謹慎理財可以「阻止你已經飽滿的錢包，再度變成空空的。」</p>
