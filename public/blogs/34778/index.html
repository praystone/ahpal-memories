<p>任性刁蠻的大姐，總算要嫁人了。
那個準女婿去拜見未來的岳父岳母，新娘的父親很憂心地看著未來女婿，
說道：「結婚以後，你一定要……」
未來女婿馬上接口說：「我知道，結婚以後我一定會好好照顧她的！」
結果，新娘的父親搖搖頭說：「我的意思是說，結婚以後……你一定要……好好照顧你自己！」</p>
