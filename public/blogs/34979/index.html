<hr>
<p>同事之間要彼此相互尊重，常常心懷諒解，上級對下屬也要心存尊重，而不是同情。</p>
<p>這可分為兩個重點：一是尊重對方的想法、意見、人格。如果在工作上不允許對方有自己的意見、想法，會讓對方沒有成就感。所以不要堅持一定要照自己的方式去做，只要不損害到我們的團體，能把事情完成即可。</p>
