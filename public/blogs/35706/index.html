<p>人生。河川。醇酒。歌曲</p>
<p> </p>
<p>人生的確是條無名的河川，有深有淺都要過過看；</p>
<p>人生的確是杯無色的醇酒，有苦有甜都必要嚐看看；</p>
<p>人生的確是首無畏的歌曲，有高有低都要配和搭一下；</p>
<p>人生都是如此，所以也只能好好的放輕鬆對待自己，</p>
<p>或許笑一笑可以面對和對待自己的生活！</p>
