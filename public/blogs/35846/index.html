<p>老王受邀到老李家中作客… 在老李家中，</p>
<p>只見老李都以「親愛的」來稱呼老婆。</p>
<p>老王見狀很感動的對老李說：</p>
<p>「你真的是不容易耶！結婚快10年了，</p>
<p>你還是這樣甜蜜的稱呼你太太…」</p>
<p>「其實，」老李小聲的說 ：</p>
<p>「我忘記她名字很久了說…」</p>
<p>要注意喔&hellip;&hellip;</p>
