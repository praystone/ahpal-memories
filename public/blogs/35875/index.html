<p>漠刀絕塵男御天五龍之「紫芒星痕」荒漠狂沙走萬里，孤寂天涯一人行。霹靂天啟 第32集四魌界獨鳴峰默風 (荒漠刀皇)醉飲黃龍、笑劍鈍、嘯日猋、刀無極 (御天五龍)死神御不凡、霜兒上天界漠刀 (叔父)狂沙捲暴、貫天千迴影、迴旋天斷刀無痕、漠風狂斬、逆刀迴旋、皇刀御天、荒漠沙風、狂濤怒潮、狂殺風暴、絕刀怒風鳴逆轉迴生皇者神鍊</p>
