詞/曲：洪文斌</p>
<p>不知喝了多少杯　不知醉了多少回
不知哭了多少夜　不知會如此傷悲
傷心的眼淚滴成一杯又一杯
愛情的傷害　讓我嚴重的後悔
無情的無情的愛人　未曾向我告別
無情的無情的愛人　你的感情重疊
感情已摧毀　美夢已破碎
凋零的花蕊　葉散枝枯萎
將如何等待　春天的雨水
今生今世　恐怕已無法挽回</p>
