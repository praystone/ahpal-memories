<p>★上周被下放3A的台灣左投倪福德，昨天臨時被老虎召上大聯盟春訓，在最後1場熱身賽對洋基中繼1.2局，先後K掉強打坎諾、波沙達和夏維茲，春訓自責分率僅有0.77。</p>
<p>倪仔在春訓尾聲插花代班，雖然無法改變開季得待3A的結果，但能K掉3位生涯合計607轟的強打者，堪稱是「重量級」的演出，也增添了未來升上大聯盟的可能性。</p>
