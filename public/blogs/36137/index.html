<p><strong>發文</strong>：2011-04-01</p>
<p><strong>瀏覽</strong>：63 次 ｜ <strong>回應</strong>：50 則</p>
<hr>
<p>相傳</p>
<p>古時有位男子出征</p>
<p>其妻朝夕倚於高山上的大樹下祈望</p>
<p>因思­念邊塞的愛人.哭於樹下</p>
<p>淚水流過後</p>
<p>流出來的是粒粒鲜红的血滴­</p>
<p>血滴化為红豆</p>
<p>红豆生根發芽</p>
<p>長成大樹</p>
<p>結滿了一樹红豆</p>
<p>人們稱之為相思豆</p>
<p>日復一日.春去秋來</p>
<p>大樹的果實</p>
<p>伴着姑娘心中的­思念</p>
<p>慢慢的變成了地球上最美的紅色心型种子—相思豆</p>
<p> </p>
<p> </p>
