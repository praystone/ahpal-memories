<p>顏容憔悴的病人對醫生說：我家窗外的野狗整夜吠個不休,我簡直要瘋了!</p>
<p>醫生給他開了安眠藥。一星期後,病人又來了,看上去樣子比上次更疲憊。醫生問：安眠藥無效嗎?</p>
<p>病人無精打采道：我每晚去追那些狗,可是即使好不容易捉到一隻,牠也不肯吃安眠藥。</p>
