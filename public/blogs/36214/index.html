<p>在太太的生日宴會上，丈夫當眾把一顆金光閃爍的寶石贈給了他的夫人。</p>
<p>一位朋友對說：「瞧您夫人多高興啊！如果你送她一輛奔馳汽車，不是更實惠嗎？」</p>
<p>「我也曾這麼想過，」這位丈夫攤開手悄聲對朋友說：「可惜這種轎車目前還沒有假的!」</p>
