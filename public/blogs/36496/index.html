<p>一個人看到朋友穿了一雙漂亮的皮鞋，大為羨慕，一問之下方知是鱷魚皮鞋，且價錢昂貴。於是他便決定自己去獵殺一只鱷魚。</p>
<p>他找到一個沼澤，跳下水去和一只鱷魚惡斗許久。好不容易才把鱷魚拖了上來。</p>
<p>只聽他大歎 一口氣道：「浪費了那麼多時間！這只鱷魚竟然沒有穿鞋！</p>
