<p>一位年邁但仍然精力旺盛的高爾夫愛好者前去找巫師，詢問天堂上是否有高爾夫球場。</p>
<p>巫師查了半天，終於開口說：「我得到的既有好消息又有壞消息。」</p>
<p>老人說：「先告訴我好消息吧。」</p>
<p>「天堂上有很寬闊的高爾夫球場。」巫師說。</p>
<p>老人接問：「現在告訴我壞消息吧。」</p>
<p>巫師說：「下星期日上午十點就該你發球了！」</p>
