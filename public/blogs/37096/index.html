<p><strong>發文</strong>：2011-04-04</p>
<p><strong>瀏覽</strong>：155 次 ｜ <strong>回應</strong>：17 則</p>
<hr>
<p> </p>
<p> </p>
<p>風不定、人初靜，明日落紅應滿徑；
流不盡、許多愁，便作春江總是淚。
昨夜猶聽舞劍曲，今宵只盼孤雲影，
回首君身已不在，此恨永刻白蓮心。</p>
<p> </p>
<p>清明 &lt;杜牧&gt; </p>
<p>      清明時節雨紛紛，路上行人欲斷魂，</p>
<p>      借問酒家何處去，牧童遙指杏花村。</p>
<p> </p>
