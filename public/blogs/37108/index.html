<p>影現金剛質不變 , 人去影滅鑽未前 rn,</p>
<p>拈花一笑心自靜 , 未笑之前不起緣 ,</p>
<p>得失隨緣恩怨泯 , 不記得失無恩怨 ,</p>
<p>聆聽自然滌心境 , 自然本質在此間 ,</p>
<p>真誠如歌天地遠 , 放心暢意事事圓 ,</p>
<p>大路朝我自行天 , 大步前邁心坦言 ,</p>
<p>名利淡泊襟雲水 , 心上塵土本自粘 ,</p>
<p>無緣無塵無一事 , 無佛佛無佛佛圓 .</p>
