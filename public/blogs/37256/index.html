<p>有一個記者採訪一個精神病院的院長問：&ldquo;你們用什麼方法確定患者是否完全康復呢？&rdquo;</p>
<p>院長說：&ldquo;我們給他一個測試，我們在一個浴缸盛滿水， 旁邊放一個湯勺和一個大碗讓</p>
<p>他們把缸裏的水排出去。</p>
<p>記者不以為然說：&ldquo;那當然是用大碗了！&rdquo;</p>
<p>院長看了他一眼，慢 慢的說：</p>
<p>&ldquo;正常的人是拔掉塞子的．．．．．．&ldquo;XD</p>
