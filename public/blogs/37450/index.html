<p>直到他消失 你才懂得 去珍惜身邊每個
美好冬季 只是他早已離去
直到你想通 他早已經 不再對你留戀
最後的你 開始了一段掙扎
你那麼愛他 為什麼不把他留下
為什麼不說心裡話
你深愛他 這是每個人都知道啊
你那麼愛他 為什麼不把她留下
是不是你有深愛的兩個他
所以你不想再讓自己 無法自拔</p>
<p>哈 無法自拔 那就不要拔了 越拔越傷心阿</p>
