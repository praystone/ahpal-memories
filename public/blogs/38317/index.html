<p>惜 　緣</p>
<?xml:namespace prefix = o ns = "urn:schemas-microsoft-com:office:office" />rn你我相逢即有緣，

布施歡喜得人緣。

不以情牽結淨緣，

以道相見真法緣。

莫論是非免惡緣，

謙卑禮讓種善緣。

智愚美醜皆因緣，

生老病死了塵緣。



損我逆我消孽緣，

得失毀譽如幻緣。

少欲知足修道緣，

慈悲喜捨是佛緣。
