    <div class="blog-content"><p><strong>作者</strong>：麝香豬</p>
<p><strong>發文</strong>：2011-04-08</p>
<p><strong>瀏覽</strong>：101 次 ｜ <strong>回應</strong>：18 則</p>
<hr>
<p>影子 黏在冰冷的牆上縮在地上 將自己圈起
放聲 哭到  失聲 力竭
不敢相信 不想承認</p>
<p>双耳 幻聽著你的聲音
卻見不著熟悉身影</p>
<p>我該怎辦 該如何再愛你
再見 分手了 難道不能挽回</p>
<p>該怎辦 該如何做
才能再許你  相守到永恆
用背敲擊著身後的鐵櫃</p>
<p>那空洞的聲響  宛如你的回應
我笑了笑   知道了
該如何作你的新娘</p>
<p>分享</p>
