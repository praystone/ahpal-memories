<p>滴兒的心聲..</p>
<p>我是一顆孤單的滴兒來到這世上..
最怕每日朝陽昇起
將我融..
掉落泥土</p>
<p>有誰..
誰願來疼..
誰願把我裝入瓶..</p>
<p>抓一把相思花..
將我融入吧!
伴妳生生又世世~~~</p>
