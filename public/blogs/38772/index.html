<p>玉芙蓉
情劍喬飛之妻，沉魚落雁、才貌雙全，有江北第一才女之稱，原本幸福的一家，卻慘遭蕭雨的毒手而破碎，愛女慘死、丈夫精神錯亂。玉芙容大難不死獲救，並習得佛道混合之招，自創芙蓉山莊。最後在素還真協助下，夫妻得以團聚，挺身出面指控歿神惡行。</p>
