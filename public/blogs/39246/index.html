<p>好幾天沒PO歌也沒PO文了謝謝很多好友都來關心我不好意思，讓你們擔心了上星期五舉辦了小小的單身派對（其實只有我自己知道）有過去的同事（鐵人群）　現在的同事（水番妹）　未來的同事（現在的客戶兼廠商，以後要一起去廟口賣香腸）　和２位蠻特別的朋友心情好多了，看著你們，很開心，謝謝。來首水番最近每天都在聽都在唱的歌戴佩妮-野薔薇</p>
