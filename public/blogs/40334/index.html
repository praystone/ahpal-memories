<p>神出鬼沒的蟑螂，最愛隱身於掌管我們民生大計的廚房裡。面對「打不死的蟑螂」，</p>
<p>我的辦法是——將一塊浴用香皂切成數小塊，置於容器內注入清水，擺放在蟑螂出沒的</p>
<p>櫥櫃內，不出數日，打開櫥櫃將令您訝異於蟑螂的無影無蹤，櫥櫃內還多了怡人的香</p>
<p>味。想要效果持續，僅須定期補充香皂容器內的清水。</p>
