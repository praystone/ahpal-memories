<p><strong>瀏覽</strong>：25 次 ｜ <strong>回應</strong>：1 則</p>
<hr>
<p>日本福島核電廠的搶救工作進展不大，當局計劃用沸石，過濾被輻射污染的海水。</p>
<p>東京電力公司表示，先前主動向大海排放的1萬噸低放射性污水，輻射量有1千5百億貝可，比當初估計的少2百億貝可。</p>
<p>但由於2號機組附近的高輻射污水曾經大量洩漏，原子能安全保安院要求東電加強監測，檢驗魚蝦類的輻射，作出詳細評估。</p>
