<p> </p>
<p> </p>
<p>人生就是一場戲。</p>
<p>因為有緣才相聚。</p>
<p>相扶到老不容易。</p>
<p>是否更該去珍惜。</p>
<p>為了小事發脾氣。</p>
<p>回頭想想又何必。</p>
<p>別人生氣我不氣。</p>
<p>氣出病來無人替。</p>
<p>我若氣死誰如意。</p>
<p>況且傷身又費力。</p>
<p>鄰居親朋不要比。</p>
<p>兒孫瑣事由他去。</p>
<p>吃苦享樂在一起。</p>
<p>神仙羨慕好伴侶。</p>
