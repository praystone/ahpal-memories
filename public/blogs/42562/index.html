<p>老張結婚二十年，最近居然決定 和
太太離婚，因為太太一生</p>
<p>氣起來就會用盤子丟他。</p>
<p>他的朋友都勸他：「都忍了那麼久了，何必現在要離婚呢？」</p>
<p>老張無奈的說：「我實在受不了啦，因為她的盤子越丟越準了！」</p>
