<hr>
<p>兩個探險家在叢林中旅行狩獵，突然有隻兇猛的獅子跳到他們面前。</p>
<p>「保持冷靜。」其中一人低聲說：「記得我們看過的那本講野獸的書嗎？</p>
<p>見到獅子時，只要站著不動和盯著牠看，牠就會轉身逃跑。」</p>
<p>「你說得不錯。」他的同伴回答：「你看過那本書，我也看過，可是獅子看過嗎？」</p>
