<p> </p>
<p>別人的阿君仔是穿西米囉，阮的阿君仔喂是賣青蚵，</p>
<p>人人叫阮是青蚵仔嫂，欲吃青蚵仔是免驚無。</p>
<p>別人的阿君仔是緣投仔桑，阮的阿君仔喂是目睭拖窗，</p>
<p>生做美醜是免怨嘆，人講歹尪喂是吃昧空。</p>
<p>別人的阿君仔是住西洋樓，阮的阿君仔是睏土角兜，</p>
<p>運命好歹是免計較，若有認真仔喂是會出頭。</p>
<p> 
 
人不必自怨自艾，只要自己努力不懈，一定會有出頭天</p>
