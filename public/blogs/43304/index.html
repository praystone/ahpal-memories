<p>徘徊窗外不免傷心
何處才是我的終點
街燈下我依舊孤寂
就讓夜雨陪我哭泣
走過每個夜直到星辰依稀
等待再次相見的黎明
雖然愛你的心早已感覺疲憊
還是無法停止想你
啊～日以繼夜的想你
翻閱塵封已久的日記
日以繼夜的想你
回想你我最初的相遇</p>
