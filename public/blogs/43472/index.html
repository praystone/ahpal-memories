<p><strong>發文</strong>：2011-04-24</p>
<p><strong>瀏覽</strong>：47 次 ｜ <strong>回應</strong>：5 則</p>
<hr>
<p>給妳一碗桂花釀　碗底全是碎花瓣
甜的那麼淡　心是多麼傷
滿臉是淚的我　妳看也不看</p>
<p>為了和妳好聚好散　不敢說出多悲傷
妳的心已淡　我的情未斷
怎能相信我們　還來日方長</p>
<p>請妳喝完桂花釀　從此不再為妳想
怕妳又是我的方向　永遠都為妳心亂　心亂</p>
<p>請妳喝完桂花釀　如果妳真的可以忘
不再說該誰欠誰還　相不相愛都無關</p>
