<p>缺了一角  不完整 世界未崩塌  我已先跌倒</p>
<p> </p>
<p>失去了一點 不算什麼 陽光正艷  心已冰冷</p>
<p> </p>
<p>獨木舟上面的人 正在努力求救 訊號升起</p>
<p> </p>
<p>他漂流極地  正被漩渦衝擊 </p>
<p> </p>
<p>就是要沉淪一次  才知道力抗恐懼</p>
<p> </p>
<p>我多想 這次的夢 永遠別醒</p>
<p> </p>
<p> </p>
<p>在沉歿在海之中&mdash;你的心臟裡</p>
