<p>靜靜的 我漂浮到了一個空間</p>
<p> </p>
<p>反而每個熟悉物景攘上一層不協調的生疏感</p>
<p> </p>
<p>詩來杯酒倒不滿</p>
<p> </p>
<p>原來酒杯裡酒也漂浮了起來</p>
<p> </p>
<p>這可是奇觀啊</p>
<p> </p>
<p>假如一層層酒漂浮在我的面前</p>
<p> </p>
<p>彷彿</p>
<p> </p>
<p>凡是見到這樣奇景</p>
<p> </p>
<p>心境也會漂浮到一個層次</p>
