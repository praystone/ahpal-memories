<p>一位婦人匆匆走進肉店，毫不客氣地喊道：</p>
<p> 『喂！老闆，給我一百元給狗吃的牛肉。』</p>
<p> 然後，她轉身向另一名等待的婦人說：『妳不會介意我插個隊吧？』</p>
<p> 那婦人冷冷地回答：『當然不會，既然妳那麼餓了，讓妳先買無妨。』</p>
