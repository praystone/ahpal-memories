<p>想要飛</p>

卻被四周給綁住</p>

<p>自由</p>
<p>不自覺深深嘆氣</p>
<p>就像被關在鳥籠的小鳥</p>
<p>只能看著</p>
<p>被束縛的自己</p>
<p>無法得到</p>
<p>自由</p>
