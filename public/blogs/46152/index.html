    <div class="blog-content"><p><strong>作者</strong>：etccjbcjmd</p>
<p><strong>發文</strong>：2011-05-04</p>
<p><strong>瀏覽</strong>：36 次 ｜ <strong>回應</strong>：1 則</p>
<hr>
<p>偌大的天空中</p>
<p>一隻孤雁輕展它的翅膀</p>
<p>在藍天中無聲無息的飛翔著</p>
<p>尋找一棵茂盛的樹</p>
<p>築一個溫暖的家</p>
<p>許久—它在大松樹上停頓下來</p>
<p>忙碌地建造</p>
<p>一陣強風無情的吹襲著</p>
<p>一團黑雲轉眼的也跟著過來</p>
<p>帶來了一場豪雨</p>
<p>風吹雨打</p>
<p>它的理想破裂了</p>
<p>看它在黑暗中再度展開翅膀</p>
<p>投入茫茫的大地</p>
<p>尋尋覓覓</p>
<p>重建家園</p>
