<hr>
<p> </p>
<p>你知道嗎？處理魚肉的切菜板，不能用熱水清洗喔！</p>
<p>一般人會覺得用熱水可能可以達到去腥的效果，但事實上並不然。</p>
<p>由於魚肉裡含有蛋白質，若是用熱水清洗，</p>
<p>反而會讓蛋白質凝固，因此產生腥味。</p>
<p>正確的方式應該要用鹽巴刷洗，</p>
<p>然後再用冷水沖乾淨，</p>
<p>最後在放在陽光下曝曬，</p>
<p>這樣才可以達到徹底殺菌的效果喔！ </p>
