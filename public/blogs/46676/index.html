<p><strong>瀏覽</strong>：65 次 ｜ <strong>回應</strong>：2 則</p>
<hr>
<p>科學家在美國發現了一種長度超過5公分的巨型螞蟻化石，相信這是地球上出現過的最大的螞蟻。</p>
<p>英國廣播公司報導，科學家之前也曾在歐洲發現過非常類似的化石，年代也在大約5000萬年前。	科學家因此認為，歐洲和北美大陸，在當時可能比現在近得多，這種大螞蟻可能會經過當時存在的連接通道在兩個大陸之間遷徙。</p>
