<p>嬌顏如花，清麗絕美的臉頰上掛著輕柔笑容,
三千青絲被一條淡綠色的帶隨意束著,如同瀑布一般的垂落而下，
蔓過纖細柳腰，輕風拂來，青絲飄動，那般風采，仿若落下凡塵的謫仙。</p>
