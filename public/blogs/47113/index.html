<p>沒品，『熱戀舉白旗』的『超冷感星座』</p>
<p>作者：艾菲爾</p>
<p>很多人感情失敗的原因，就是因為情人突然在熱戀期沒有預警的『踩煞車、舉白旗』，由於事先沒有預兆、事後又百思不得其解，讓人腦帶中充滿『？』。放鬆心情，艾菲爾老師要分析什麼星座的情人容易在熱戀期『踩煞車、舉白旗』。
艾菲爾老師提醒參考『太陽與水星星座』</p>
