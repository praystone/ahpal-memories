<p>母親的呼喚〖轉貼〗</p>
<p>有一種很遠很遠的聲音
始終在耳邊縈迴
有一種很柔很柔的情感
激動著我的心扉
　　
那可是母親的呼喚
在盼著孩子的歸心
那可是孩子的思念
在作一個很美的夢幻
　　
不，但願不是如此
眼前橫亙著大海汪洋
可這種聲音確實存在
微弱微弱且又悠長悠長</p>
