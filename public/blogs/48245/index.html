<p>抹不掉—</p>
<p>歲月的痕跡</p>
<p>忘不了—</p>
<p>往日的歡笑</p>
<p>滿懷的感傷</p>
<p>淡淡的愁緒</p>
<p>幽幽的—</p>
<p>起自心靈深處</p>
<p>片片相思—</p>
<p>化為滴滴珠淚</p>
<p>輕輕一聲—別了</p>
<p>載走了—</p>
<p>無數憧憬、無數美夢</p>
<p>只留下一絲淡淡的—</p>
<p>惆悵</p>
<p> </p>
<p>沙場上的我呀—</p>
<p>繪龍繪虎</p>
<p>卻奈不住</p>
<p>引一壺清酒所給予的—</p>
<p>那般鄉愁</p>
<p>和老邁</p>
<p> </p>
