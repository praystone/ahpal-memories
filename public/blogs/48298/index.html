<p>狼嘯 也能如此可愛…</p>
<p> </p>
<p> </p>
<p>不年輕了.我們會說年輕真好。
看到死亡.我們會說活著真好。
傷心失意的時候.卻說不出活著有什麼好。
然而.要是沒有活下去.
也就看不到人生的千迴百轉.
也不會知道曾經認為無法承受的痛苦是會過去的。
當你以為心已經荒蕪.它卻會出奇不意開出花來。
那一刻.所有的荒蕪都成了往事。
活著就是君王。</p>
