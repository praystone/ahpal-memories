<p><strong>發文</strong>：2011-05-12</p>
<p><strong>瀏覽</strong>：26 次 ｜ <strong>回應</strong>：0 則</p>
<hr>
<p>天寬地闊，</p>
<p>遙遠的一根弦，</p>
<p>在白晝與黯夜間；</p>
<p>在浪花與飛鳥間—彈唱。</p>
<p>我孤寂地走向地平線彼端，</p>
<p>悲愴一如溫煦淒麗的夕日。</p>
<p>走在茫然在迫人屏氣凝神的—</p>
<p>鋼索</p>
<p> </p>
<p>合當哭泣?抑或高歌?</p>
<p>繫於一線之間，</p>
<p>我肅靜地緊緊握住，</p>
<p>當所有冥思化作雲烟時，</p>
<p>我仍成為一片—</p>
<p>蒼茫</p>
