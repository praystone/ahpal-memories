<p><strong>瀏覽</strong>：33 次 ｜ <strong>回應</strong>：0 則</p>
<hr>
<p>環保團體和政府官員今天公布的資料顯示，從日本受重創的福島（Fukushima）核電廠附近海岸所蒐集到的海草，以及東京地下水道的污物都測出輻射等級升高。</p>
<p>綠色和平（Greenpeace）和日本政府官員分別公布的檢測結果，凸顯出防止輻射藉水傳播並擴散的困難。福島核電廠遭受311東日本大地震和海嘯侵襲，核能危機目前仍在延續。</p>
