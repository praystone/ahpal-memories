<p>有一天，阿全到夜市裡吃宵夜，他在一個生意興隆的攤位坐下。</p>
<p>阿全：
「老闆，我要一份蚵仔煎。但是我不敢吃蚵仔，可以不加蚵仔嗎？」</p>
<p>老闆：
「好…你坐一下，馬上來！」</p>
<p>阿全：
「老闆，我不要加青菜！」</p>
<p>老闆：
「喔……好」</p>
<p>阿全：
「老闆，我也不想要蛋！」</p>
<p>老闆：
「這位先生，那你點的是太白粉喔？」</p>
