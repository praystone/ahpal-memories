<p>有些故事，不一定要講給所有人聽；有些悲傷，不一定誰都會懂；
有些傷口，時間久了就會慢慢長好；有些委屈，受過了想通了也就釋然了；
有些傷痛，忍過了疼久了也成習慣了；有些藏在心底的話，不想說也就沒必要說了。
其實，並不是所有的痛，都可以吶喊；不是所有的愛，都可以表白。rn </p>
