<p>滑了一跤</p>
<p>驚蟄一地</p>
<p>跌進妳的髮間</p>
<p>棲身在妳的幽香</p>
<p>別攙扶</p>
<p>等太陽出來</p>
<p>我就隨著露珠蒸發！</p>
<p>心摺幾年都無妨</p>
<p>摺成飛機載著思念</p>
<p>摺成舟帆揚起盼望</p>
<p>皺了</p>
<p>就等春風撫平</p>
<p>層層疊疊</p>
<p>山巒疊著浪頭</p>
<p>我摺疊著鄉愁</p>
<p>想著該怎麼回家</p>
