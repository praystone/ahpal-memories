    <div class="blog-content"><p><strong>作者</strong>：任平生</p>
<p><strong>發文</strong>：2011-05-18</p>
<p><strong>瀏覽</strong>：70 次 ｜ <strong>回應</strong>：21 則</p>
<hr>
<p>一位朋友在短詩中低吟
「你給的愛</p>
<p>不是最   卻成了罪」</p>
<p>這天看到妳了  卻不知怎麼擁抱妳 </p>
<p>沒有溫度的妳</p>
<p>臉上盡是沙塵  找到真愛了嗎？</p>
<p>院子裡薄荷清涼芳香依舊</p>
<p>為妳栽植的幸運草  我看是送不出去了
 
手無措  腳踉蹌</p>
<p>眉緊皺  心糾結</p>
<p>耳聽不見鳥啼 
悲傷撐飽了胃</p>
<p>臉已瘦成一張淚</p>
