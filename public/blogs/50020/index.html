<p>相不相信？其實你是一塊磁鐵。 當你身心愉悅、喜歡自己、對這個世界充滿善意，美好的東西就自然地被你所吸引。 相反的，當你悲觀、鬱悶、覺得什麼都不對勁，負面的一切也就相繼來報到了。因為你是一塊磁鐵，吸引的是與你相關的東西， 所以快樂的你就吸引讓你快樂的人事境，煩憂的你則吸引讓你煩憂的人事境。幸運與厄運，在於你如何使用內在的磁力。這是信念的奧秘。</p>
