<p>陰鬱的霧死沈沈</p>
<p>包圍著一朵即將綻開的花</p>
<p>森寒的霧珠冷冰冰</p>
<p>禁錮著一株</p>
<p>逐漸醒轉的樹枒</p>
<p>被夜鞭策的風呵</p>
<p>在醉夢於昨日的大地上</p>
<p>試圖封鎖</p>
<p>一枝小草的出頭</p>
<p>而所有的去路</p>
<p>在垂淚的星下</p>
<p>隱隱畏縮</p>
<p>在最黑暗的地方</p>
<p>等待一聲—</p>
<p>響亮的鑼</p>
