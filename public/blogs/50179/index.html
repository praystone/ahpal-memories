<p>心亂了〖轉貼〗</p>
<p>現在的我
不想再叫任何人看到我的孤獨
 
孤獨是自己的
自己慢慢體會的
不要別人來分享</p>
<p>是自私
是無奈
是空虛
都好</p>
<p>都不要去迎接
因為沒有勇氣去面對
只能選擇逃避
做一個逃避者</p>
<p>或許會笑
笑沒勇氣</p>
<p>不想要放棄
但是怕被傷害</p>
<p>亂，亂，亂，心真的很亂，
心累了，不想再想了&hellip;&hellip;&hellip;&hellip;</p>
