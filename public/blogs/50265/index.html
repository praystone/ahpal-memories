<p><strong>發文</strong>：2011-05-21</p>
<p><strong>瀏覽</strong>：28 次 ｜ <strong>回應</strong>：0 則</p>
<hr>
<p>拖著瘦長的影子，</p>
<p>漫步在晚霞的海邊，</p>
<p>呼吸塩味的空氣，</p>
<p>踏出一串串深深的足跡。</p>
<p>如一頁頁的小舢舟，</p>
<p>將層層思念遙寄於妳，</p>
<p>呼喚妳—</p>
<p>月朖是妳我的綠衣天使，</p>
<p>照耀著妳，</p>
<p>點亮了我，</p>
<p>傳達我們的心苗，</p>
<p>東方白—</p>
<p>我們歸去，</p>
<p>乘著一彎七彩長虹，</p>
<p>帶著無窮的溫柔，</p>
<p>撒滿了溫馨的祝福。</p>
