<p>轉個圈，停在皮膚上，</p>
<p>伸出尖銳的利嘴，</p>
<p>一吸一呼的運用智商180的頭腦，</p>
<p>虛扁的身子</p>
<p>漸漸充實—圓胖了。</p>
<p>真快樂、舒暢。</p>
<p>拍!</p>
<p>轉個180度的大圈，</p>
<p>與巨大的手，做了一番艱苦的—搏鬥</p>
<p>兩眼一瞪，轉半圈，</p>
<p>雙腳一拍，伸直了，</p>
<p>停在皮膚上</p>
