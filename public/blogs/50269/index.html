<hr>
<p>窗外飄細雨，微風掠影過。</p>
<p>春雨裝扮大地，枝葉水珠點點。</p>
<p>雖說甘霖降大地，曾為幾人所珍惜。</p>
<p>春雨緜緜無絕期，</p>
<p>一陣清風，一陣春雷。</p>
<p>窗內人兒，凝眸遠景，</p>
<p>想起幕幕往事，如歷眼前，</p>
<p>不覺鼻兒已酸，更增縷縷愁思。</p>
<p>雨滴洗不去人們的三千煩惱絲，</p>
<p>只留下緜緜春雨愁煞人……</p>
<p> </p>
