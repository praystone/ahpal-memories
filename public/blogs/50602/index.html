<p>寒風起，吹皺武林江水</p>
<p>談笑酒壺乾坤袖，與君共醉</p>
<p>擊為歌傳意</p>
<p>君且隨悄醉</p>
<p>他日豈知身何在</p>
<p>相見無盡期</p>
<p> </p>
<p>既然已是斬斷了的紅絲線</p>
<p>為何又想  用</p>
<p>淚水將它—串聯</p>
<p>忍不住啊</p>
<p>忍不住—是</p>
<p>是—一個念!</p>
<p>我走過的每一步歲月</p>
<p>那裏沒有妳的影子</p>
<p>我回首的每一個世界</p>
<p>總凝結妳的笑聲。</p>
