<p>小雪問老爸：「爸，有沒有比較恐怖的書ㄚ？」</p>
<p>「有ㄚ，當然有。」老爸說：</p>
<p>「有本書你老爸我看了二十多年都還覺得恐怖。」</p>
<p>「啊？ 不會吧？」小雪問：</p>
<p>「哪一本書會看了二十多年還覺得恐怖？」</p>
<p>老爸認真回答的說：「結婚證書。」</p>
