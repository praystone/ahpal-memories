<hr>
<p>你這隻昏蟬，現在才五月就大聲嚷嚷！</p>
<p>輕一些</p>
<p>要不賴床一點</p>
<p>那晨曦飲露</p>
<p>莫驚擾薔薇向風伸展</p>
<p>說悄悄話</p>
<p>你這隻畫眉，現在才天亮就蹦著跳躍</p>
<p>靜一些</p>
<p>別急著悅耳</p>
<p>那林中瑣語</p>
<p>莫驚擾徨恐的唇</p>
<p>吻著花蕊</p>
<p>風與薔薇</p>
<p>望著同樣的天空</p>
<p>跨過同樣的江河</p>
<p>我知道這夢很美</p>
<p> </p>
