<p>乾 坤 羽 扇 藏
神 鬼 貫 陰 陽
山 澤 雷 風 馭
臥 龍 吟 嘯 長</p>

山 澤 雷 風 飛 遁 甲
我 扶 天 局 佈 三 方</p>
