<p>如果你冷　我將你擁入懷中</p>
<p>如果你恨　我替你擦去淚痕</p>
<p>如果你愛我　我要向全世界廣播</p>
<p>如果你離開我　我會默默的承受</p>
<p>我的愛　為你開啟　像白色的閃電　劃破天際</p>
<p>我的愛　為你奔馳　像紅色的血液　充滿身體</p>
<p>我只是要你知道一件事　就是我愛你</p>
<p>就是我愛你　愛你</p>
