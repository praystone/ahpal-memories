    <div class="blog-content"><p><strong>作者</strong>：浮雲</p>
<p><strong>發文</strong>：2011-05-30</p>
<p><strong>瀏覽</strong>：21 次 ｜ <strong>回應</strong>：0 則</p>
<hr>
<p>希望如黃花凋謝</p>
<p>我的愛我的夢</p>
<p>卻在世間的傳說中</p>
<p>永恆地留存</p>
<p>望著星空</p>
<p>眼裡閃亮的是你</p>
<p>而你的關懷</p>
<p>在寒風中</p>
<p>如此逼近我</p>
<p>你主宰了</p>
<p>我的青春歲月</p>
<p>又何須確定</p>
<p>我若有若無的情</p>
<p>終究,煙消雲散</p>
<p>別辜負我</p>
<p>細細為你珍藏的愛戀</p>
<p>別試想給予我</p>
<p>孤獨的滄桑</p>
<p>轉自陳綺</p>
