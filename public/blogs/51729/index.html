<p><strong>發文</strong>：2011-05-30</p>
<p><strong>瀏覽</strong>：18 次 ｜ <strong>回應</strong>：0 則</p>
<hr>
<p>像一朵微風吹送的浮雲 我想 我或許迷了路了 這個世界 絕不是 那當初曾經允諾給我的藍圖</p>
<p>可是 已經有我的淚水 灑在山徑上了 已經有 我暗夜裡的夢想在森林中滋長 我的渴望和我的愛</p>
<p>在這裡 像花朵般綻放過又隱沒了 而在水邊清香的蔭影裡 還留著我無邪的心</p>
<p>留著我所有的 遲疑惶恐 卻無法再更改的 腳印</p>
