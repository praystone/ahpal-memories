<p>你敢寫下你最愛人的名字嗎?  
如果，某一天，你在某一個這樣的帖子中看到自己的名字，你的心情會是怎樣？不要認為不可能，你真的可以看到，看，奇跡正在趕過來。</p>
<p>人生匆匆數十載，誰在你的心中的位置最重要？</p>
<p>寫上他(她)的名字，你的祝願也會相繼送出，然後，等待，等待著你愛的人感受到你的祝福。</p>
