    <div class="blog-content"><p><strong>作者</strong>：楊小咩</p>
<p><strong>發文</strong>：2011-05-31</p>
<p><strong>瀏覽</strong>：30 次 ｜ <strong>回應</strong>：0 則</p>
<hr>
<p>總是天真地以為，你把我看得很透徹。</p>
<p>其實，我把快樂掛在臉上，把傷痛藏在心裡，</p>
<p>我的表情可以表達千種心情，但那最傷最痛的部分，</p>
<p>不是你輕易就能看得到的。</p>
<p>你說的無心的一句話，做的不經意的一件事，</p>
<p>或許就是致我傷痛的地方。</p>
<p>愛情是需要細心呵護的，不要因為我愛你，</p>
<p>就可以隨意進出我的心房。</p>
