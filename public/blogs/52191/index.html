<p>欣賞別人的談吐、會提高我們的口才；</p>
<p>欣賞別人的大度、會開闊我們的心胸；</p>
<p>欣賞別人的善舉、會淨化我們的心靈。</p>
<p>欣賞別人其實是少一點挑剔、多一點信任；</p>
<p>多一點熱情、少一點冷漠；</p>
<p>多一點仰視、少一點鄙夷。</p>
<p>欣賞多一點、矛盾和誤解定會少一點、</p>
<p>人與人的距離才會更近一點。</p>
