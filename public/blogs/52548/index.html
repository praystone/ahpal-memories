<p><strong>發文</strong>：2011-06-03</p>
<p><strong>瀏覽</strong>：60 次 ｜ <strong>回應</strong>：3 則</p>
<hr>
<p>如果你對我不耐煩了</p>
<p>第一次我只會默默的檢討
第二次我只會默默的生氣</p>
<p>第三次我只會默默的掉淚</p>
<p>但請你記住，如果有一天</p>
<p>我不再對你說我想你</p>
<p>不再對你說我愛你</p>
<p>不再為你吃醋</p>
<p>不再主動找你</p>
<p>不再對你熱誠</p>
<p>不再黏著你</p>
<p>那我一定是對你死心了</p>
<p>恭喜你 你自由了</p>
<p>漸漸的淡了 倦了</p>
<p>我將不再束縛你</p>
<p>因為我放棄你了</p>
