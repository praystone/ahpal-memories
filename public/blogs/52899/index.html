<p>話說就在端午節前夕</p>
<p>一隻小壁虎在一處工地上游蕩</p>
<p>這時正好一條大鱷魚爬了過來，正準備要一口吃掉它，</p>
<p>情急之下，小壁虎上前一把抱住了鱷魚腿，大聲喊：『媽媽！』</p>
<p>大鱷魚一愣，立即老淚縱橫：</p>
<p>『孩子，別再上班了，半個月就瘦成這樣了，端午節好好休息吧！』</p>
<p> rn                 祝端午節快樂！</p>
