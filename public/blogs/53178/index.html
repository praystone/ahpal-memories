<p>迷惘的幻滅</p>
<p>空空的意念</p>
<p>是我對妳思念的終點</p>
<p>當我發現妳依偎在他懷裏</p>
<p>已結束長久以來的歡笑</p>
<p>雖然世上沒有人能代替妳</p>
<p>但我會試著抓住每一秒的寧靜</p>
<p>雖然我不會忘記妳</p>
<p>但也許我會忘記過去</p>
<p>去吧!我的情</p>
<p>去吧!我的愛</p>
