    <div class="blog-content"><p><strong>作者</strong>：楊小咩</p>
<p><strong>發文</strong>：2011-06-09</p>
<p><strong>瀏覽</strong>：107 次 ｜ <strong>回應</strong>：1 則</p>
<hr>
<p>你若深愛一個人，就要學會阻止自己，</p>
<p>不要把他當成全部，不要所有的話都跟他講，</p>
<p>不要所有的秘密都和他分享。</p>
<p>你投入的多了，你就會慢慢地忘記了自己，</p>
<p>沒有自我的人，在愛情裏是找不到自己的位置的，</p>
<p>唯一的結局，愛情被你抓得越緊，</p>
<p>卻逃得越遠，最終只能擊碎你的夢幻，</p>
<p>讓曾經的諾言，如飛花般吹散在風中。</p>
