<p>幸福是什麼？ </p>
<p>幸福就是牽著一雙想牽的手，</p>
<p>一起走過繁華喧囂，</p>
<p>一起守候寂寞孤獨；</p>
<p>就是陪著一個想陪的人，</p>
<p>高興時一起笑，</p>
<p>傷悲時一起哭；</p>
<p>就是擁有一顆想擁有的心，</p>
<p>重複無聊的日子不乏味，</p>
<p>做著相同的事情不枯燥&hellip;&hellip;</p>
<p>只要我們心中有愛，</p>
<p>我們就會幸福，</p>
<p>幸福就在當初的承諾中，</p>
<p>就在今後的夢想裡!</p>
