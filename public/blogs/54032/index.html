<p>把眼睛貼在夜的</p>
<p>鼾聲中</p>
<p>我們可以</p>
<p>藉著幽微的星光</p>
<p>辨清來時路</p>
<p> </p>
<p>而窸穿的異響</p>
<p>掩過海潮音時</p>
<p>只要凝神傾聽</p>
<p>仍然可以分清異同</p>
<p> </p>
<p>在溫柔的夜閊中</p>
<p>我們讓鏗鏘的鋼盔裏</p>
<p>復習秋海棠的熱情</p>
<p>並以出征的英姿</p>
<p>巡視我們麗的</p>
<p>防線</p>
