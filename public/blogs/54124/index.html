<p>人 海 茫 君 何 在
聲 長 嘆 漫 沉 煙
殘 月 幾 照 深 苑
梧 桐 葉 落 天
暗 夜 淚 咽 對 孤 枕
浮 舊 景 若 往 現
為 妾 禮 佛 觀 音 前
相 思 荊 纏 肩</p>
