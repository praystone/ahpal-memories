<p>身著羽衣步輕盈
無我忘界音律明
彩蝶低舞揉花淚
鳳凰枝頭寄空榷
雙瞳如水多情邃
飛雲逐夢深山寐
翼窗對坐三更月
心香一盞善念生
有情天地巧逢卿
靈氣觸動智空明
犀利文捲眾群雄
一襲清風藏傲骨
點滴情懷築夢聆
通天琴音伴君行</p>
