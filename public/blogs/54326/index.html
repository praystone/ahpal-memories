<p>握一枚酡顏的槭葉</p>
<p>秋就把你我囚禁</p>
<p>消溶在山腹的林中</p>
<p>如一粒愛的種籽</p>
<p>待遲來的一場春雪之後</p>
<p>你我就是那開啟封凍大地的金鑰</p>
<p>在陽光下茁放愛的枝芽</p>
<p>栩栩的如你如我</p>
<p>步向繁花的旅途</p>
<p>纒綿成釀蜜的進程</p>
<p>而後</p>
<p> </p>
<p>在愛的年輪上</p>
<p>時時刻刻的</p>
<p>品飲</p>
<p>自己</p>
