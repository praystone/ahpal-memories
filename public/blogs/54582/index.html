<p>1965臺灣四百年人物誌之戰後時期~李嗣璁(行憲後002監察院長)
李嗣璁是河北省的監察委員，民國47年被選為監察院副院長。
53年于右任院長病逝後，他以副院長身份代理院長職務。
54年投票依法宣佈當選，李院長家中人口眾多，已身為祖父，在家中含飴弄孫。</p>
