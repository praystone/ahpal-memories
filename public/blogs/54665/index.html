<p>娉婷駐足的青春</p>
<p>忘情攬位夜底清寂</p>
<p>精緻如醽醲的心事</p>
<p>唾棄擁擠的璀燦</p>
<p>兀自斟酌蒼涼的濃度</p>

<p>鐫刻燙金的典故</p>
<p>獻予斑駁而多樣底季節</p>
<p>無關掌聲與喝釆</p>
<p>游走於剎那和永恒之間</p>
