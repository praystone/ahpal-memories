<p>溝渠縱橫的阡陌</p>
<p>幽柔月光淋滴散落</p>
<p>依稀冋掌上紋路交錯</p>
<p>又彷彿歲月刻鏤之后</p>
<p>纏綿臉龐底褶皺</p>
<p> </p>
<p>燈滅月茖人也消瘦</p>
<p>任裸露暮色層層掩沒</p>
<p>倦極欲眼底眼眸</p>
<p>徬徨著該隨波隱入更漏</p>
<p>亦或堅持深情守候</p>
<p>第一抹曙色的盈盈飄過</p>
