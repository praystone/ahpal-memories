<p>一 洒 清 檀 一 裊 煙
臥 星 岩 仰 心 斗
黃 花 翠 竹 般 若 悉 法 身
萬 緣 奔 馳 卻 低 眉
龍 吟 澈 虎 嘯 懸
獅 弦 萬 法 迦 藍 情
飄 零 客 相 續 留
罔 象 玄 珠 慧 眼 傳 宇 心
雲 霓 霽 散 一 指 禪
點 磬 聲 三 藐 心
化 水 定 風 無 盡 意</p>
