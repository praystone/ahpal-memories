<p> 守口如瓶的感動</p>
<p> </p>
<p>故事中男人因為不想讓女人擔心，</p>
<p>而一如往常的假裝照常去上班，
卻跑去工地做與以往西裝筆挺的行業強烈對比的水泥廠臨時工，
男人為了不讓女人擔心，</p>
<p>把苦悶、煎熬的心情封印了起來，
而女人知道之後，也不戳破男人的謊言，
反而默默的煮著木耳、幫男人覓尋新的工作。</p>
