<p>一張臉     一席稚嫩話語     一段路 </p>
<p> </p>
<p>想著想著都被一場雷雨弄擰了</p>
<p> </p>
<p>臉扭曲     眼前的路迷濛     話失真</p>
<p> </p>
<p>想撥開滂沱簾幕看清我是誰？ </p>
<p> </p>
<p>捧在手心是淚      劃過背膀是傷痕</p>
<p> </p>
<p>沾黏髮稍的都是刃 </p>
<p> </p>
<p>踽踽獨行</p>
<p> </p>
<p>雨中看不清楚雨！</p>
<p> </p>
<p>我們誰也不是誰！</p>
<p> </p>
