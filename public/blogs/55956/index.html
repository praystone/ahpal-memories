<p>《詠》
幽嬋淺妝。嬌容淡香。讌歌清醑吟雙。宿林卿與藏。
華辭若芳。朱唇語揚。接歡蘅薄鴛鴦。樂乎雲捲長。</p>
<p>《歌》
華燈陌連。疏香色環。夜迎輕暖君前。點唇濃語歡。
微光晃懸。薰風潤顏。舞來音羽琴間。嬌態凌水仙。</p>
