<p>你戰戰兢兢地拉開窗簾，卻見她迎風招搖，花顏可掬。原來在過去的這段日子裡，你雖然忘了餵她喝水，老天卻沒忘了以雨 露眷顧她呢。許多事物悄悄地在你的視線之外進行，而且悄悄地安排好了它們自 己。天生萬物，天養萬物，一切其實無須擔心。逃避不一定躲得過,面對不一定最難受孤單不一定不快樂,得到不一定能長久失去不一定不再有,轉身不一定最軟弱</p>
