<p>少年聽雨我聽淚</p>
<p>怕黃昏卻又黃昏</p>
<p>一更  雲穿秋光嘆一聲</p>
<p>二更  雨打芭蕉愁更稠</p>
<p>三更  風吹鳥啼髮斑斑</p>
<p>四更  霙飄怒濤心如霜</p>
<p>天明夢隨眼茫茫</p>
<p>此生紅塵看不清 rn </p>
<p>英雄髻    風挽就</p>
<p>怎奈醉臥香枕肩</p>
<p>悔春潮江樓貪歡</p>
<p>怨仲夏南風催眠</p>
<p>怒秋月弄影懕懕</p>
<p>罪冬寒逼人心碎</p>
<p>美人斷弦</p>
<p>隨妳了！</p>
