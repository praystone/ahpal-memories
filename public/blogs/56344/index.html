<p>有二人被鬥牛追趕，一人爬到樹上去，另一人趕快跪在地上禱告，求上帝……結果鬥牛來了，把跪在地上的禱告者鬥的遍體鱗傷，他就說了：「為什麼上帝沒聽到我的聲音。」爬到樹上的人就說：「上帝叫你上來，你為什麼不上來。」</p>
<p>一切的不順心，將隨著事情的結束而告別我們，就讓這些隨風而逝，不再想起吧!</p>
