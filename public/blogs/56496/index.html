<p>如果用力揮霍一次  是不是甘心了</p>
<p> </p>
<p>是不是又會要更多  想要更豐厚了</p>
<p> </p>
<p>披上愛情的糖衣 雨水 體溫 眼淚 總把它擰去</p>
<p> </p>
<p>徒留一身狼狽  還要哭著說無所謂</p>
<p> </p>
<p>我醒在開始失去你的颱風天</p>
<p> </p>
<p>我醒在即將盤旋的高空</p>
<p> </p>
<p>卻哭濕天使溫柔的臂膀</p>
<p> </p>
<p>也哭唱著下一個更好</p>
<p> </p>
<p> </p>
