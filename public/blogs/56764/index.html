<p>春荷晶露洗凝脂 晚風搖 醉弄舞
荷塘水色 剪影百媚好
水瓢舀月木梳薄 紫蘿香
吻髮梢 一襲羅衫輕舞飄
築夢園 相思弦
雙鳳爐檀 香邈待君來
對鏡輕點胭脂巧
細梳妝 柳眉掃
