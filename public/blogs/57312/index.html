<p>有時候&hellip;</p>
<p>曾經的難過，嘴巴上說沒事，其實心裡難過的要死…</p>
<p>有時候常常在回憶裡掙扎，有太多的過去無法放手…</p>
<p>真的有太多的時候了不是嗎?</p>
<p>偽裝</p>
<p>只求一個人在晚上走夜路也不害怕…</p>
<p>或許</p>
<p>有時候只是想找一個藉口，找一個停下腳步可以回頭的理由，也許回到曾經就不會再痛了、不會再難過了、不會在放不下了…</p>
<p>還是</p>
<p>忘了怎麼去忘記了…</p>
