<p>沉睡 在夢境中如此清醒
此刻 瀏覽一張張 今生
被救贖的照片檔案
因為 妳撫摸的手
按下溫柔的快門 讓我
在黑白孤寂中
添了彩色的調和
我總是靜靜地擺個POSE 在每夜
欣賞一段 妳的十指交舞
輕輕地 滑落與交疊
啊！夢境又一次在沉睡中
喚起我 被救贖的我</p>
