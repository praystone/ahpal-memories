<p>點一顆心  送給一個人在心裡  送上一個吻
分一個我 放在你身邊
讓你在寂靜夜  有我相陪</p>
<p>點一盞燈  等候一個人
在窗裡  送上一份甜
分一個我  陪在你身邊
讓你在孤單時 語化綿綿</p>
<p>擁你每一秒  手不輕放
抱你每一天  心永遠那樣甜
與你在一起  是美妙的開始
與你相守是最甜的事</p>
