<p>珍</p>
<p>奈不住歲月催人老，昔日少年新賦強說愁，而令華髮早生，欲語還休!</p>
<p>妳說非是昔日寫詩的女孩，我亦非是昔日賦詞者，早已被架縛在部隊的形式骨架之上，縱使任教已年有餘，仍是一座難以掙脫的牢籠，有的只是官僚式的作風，再也沒有以往的心境了!</p>
<p>想來只有慌慌一笑，努力有些遺世獨立的冷嘲與愴然。</p>
