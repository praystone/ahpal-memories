<p>你是我最知心的朋友</p>
<p>你是我最親愛的伴侶</p>
<p>我的心在天天追想著你</p>
<p>渴望見到你的面</p>
<p>在我人生的每一個台階</p>
<p>在我人生的每一個小站</p>
<p>你的手總是在攙拉著我</p>
<p>把我帶在你身邊</p>
<p>告訴我當走的路</p>
<p>沒有滑向死亡線。</p>
<p>你愛何等的長闊深高</p>
<p>我心發出驚嘆</p>
<p>有了你還要什麼?</p>
<p>我心與你心相連</p>
<p> </p>
<p>我已起誓要跟隨你永不改變</p>
<p> </p>
