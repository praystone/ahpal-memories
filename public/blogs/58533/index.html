<p>台灣一葉蘭（學名：Pleione formosana）俗名台灣慈姑蘭、山慈姑，是台灣特有種中高海拔樹蘭亞科植物，於阿里山、溪頭地區有相當數量的野生族群分布，也是知名的觀賞植物。花期主要為春夏兩季，入秋之後以球莖冬眠。只發一葉，故名一葉蘭。</p>
