<p><strong>發文</strong>：2011-07-14</p>
<p><strong>瀏覽</strong>：39 次 ｜ <strong>回應</strong>：0 則</p>
<hr>
<p>德國網友最近上段一段影片，一隻超可愛的小貓被人撫摸時，舒服到全身軟綿綿，而牠的「肉球」(貓掌) 也跟著有節奏地一收一放，柔軟又優雅地來回擺動，彷彿正在隔空「撥琴弄弦」。</p>
<p>許多網友笑說「牠好像在彈一把看不見的豎琴！」也有人打趣說，小貓可能領悟了陰陽調和之道，擺弄爪子其實是在打「太極拳」。</p>
