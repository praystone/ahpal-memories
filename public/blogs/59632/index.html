<p>呵呵  久久之後又再度光臨亞寶</p>
<p>是要陪我小女兒養動物跟魚魚的啦</p>
<p>把我們亞寶當做一個健康的家庭休閒活動就對了嘛</p>
<p>之前忙著工作  實在也無暇當個好農漁民</p>
<p>如今女兒也大了  也到了該讓她瞭解農漁民辛苦的時刻了</p>
<p>所以特別帶她回到這裡  享受一下務農的汗水與樂趣</p>
<p>大家沒事啦  繼續繼續</p>
