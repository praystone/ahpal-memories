<p>心
複雜
搞難受
自繭自縛
該哭笑不得
一縷情絲寄髮
玉手羅敷掌心痣
孅細倩影隨風搖擺
飲孟婆湯橫過奈何橋
卻仍待還君明珠淚相思
鬼迷心竅滿腦思念欲訴情
惟郎君情牽伊人淚化相思痣
兒郎欲語還休但伊人在水一方
深情款款郎心卻深陷仍無法自拔
鳳臉珠淚婆娑一顰一笑如入木三分
三世情緣一世現郎君仍待伊人笑點頭</p>
