<p>多年生籐本落葉植物，屬葫蘆科。其葉心形，夏季開花，秋天結果。其果實亦稱羅漢果，含有、多種胺基酸和維生素等藥用成分，中國傳統中醫用它化痰止咳已有300多年的歷史</p>
<p>對抑制喉痛，聲啞及咳嗽的藥效最為人所熟識</p>
