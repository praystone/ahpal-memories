<p>為了等妳
手被凝望的漩窩捲進去了</p>
<p>為了等妳
腳被熱燙流沙箍緊地困住</p>
<p>為了等妳
背影被滿弦的月亮曬駝了</p>
<p>為了等妳
晨曦被深夜上了手銬擄走</p>
<p>為了等妳
星子也不敢睜開眼睛閃爍</p>
<p>為了等妳
寂寥的街燈被依戀燙彎
生命被時間無情的篩漏
心扭曲了
我快瘋了</p>
