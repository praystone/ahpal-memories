<p>就像荒野任意飛翔的孤雁　為什麼疲倦從不願意歇歇腳</p>
<p>只回頭掠過了記憶　掠過我盼望的眼　盼望的眼</p>
<p>就像那輕風吹動藍藍的海　層層的波浪好像我徬徨的心</p>
<p>只因為你去了又來　帶給我無限傷懷　無限傷懷</p>
<p>＃怎麼能再將你留住　盼望你再歸來</p>
<p>　來………………………</p>
<p>　來………………………</p>
<p>只因為你去了又來　帶給我無限傷懷　無限傷懷</p>
<p>Repeat ＃</p>
