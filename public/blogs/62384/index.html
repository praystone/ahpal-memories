<p>窗外正傾盆大雨</p>
<p>遠處天地陰陽閃電現</p>
<p>平地驚人天雷聲轟隆隆</p>
<p>如同心中在傷痛不已</p>
<p>震動著已受傷不止的心</p>
<p>昨夜淚溼滿床單 今早雙眼紅腫</p>
<p>卻已嚎啕無聲 一片死寂</p>
<p>夜深了 傷也更深了</p>
