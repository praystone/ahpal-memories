<p><strong>瀏覽</strong>：9 次 ｜ <strong>回應</strong>：0 則</p>
<hr>
<p>長風蕭瑟 舊夢前塵 窗靜煙沉孤影
漫點寒星 朦朧餘光 今夕是何夕
遙思天涯散曲 空挑數閒愁
花弄蝶衣月墬 迷魂幾縷香
以唇封箋 魂絲荒漠 何日逢君時
一城風絮 夜色淒迷 雨落春歸處
黃鶯樹梢輕啼 聲聲相思惹
白紙泣淚無情 碎顰鏡中人
青絲如霜 黃花殘燭
悲歎逝芳菲舊愁不盡
新怨心頭 無語只悽涼</p>
