<p>想待在妳最絢麗的夢</p>
<p>夢裡我們交疊著愛</p>
<p>夢裡我們堆砌著笑</p>
<p>夜順著河流出海</p>
<p>那星子各自坐好</p>
<p>等著黑暗琢著鑽石</p>
<p>等著歡愉拍擊閃耀</p>
<p>心被風偷走</p>
<p>唇也風乾了</p>
<p>妳不要切斷思念唷</p>
<p>那會多生幾個角兒</p>
<p>我向雲霓瞅了兩眼</p>
<p>就賒一場秋雨潤澤</p>
