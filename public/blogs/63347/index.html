<p>雨夜激起了心浪</p>
<p> </p>
<p>翻騰的飛躍在心房</p>
<p> </p>
<p>猶如你甜膩的嗓音</p>
<p> </p>
<p>攪和在腦海中</p>
<p> </p>
<p>像</p>
<p> </p>
<p>疊了又疊的雲層</p>
<p> </p>
<p>藏了又藏的思念</p>
<p> </p>
<p>闖了又闖的紅燈</p>
<p> </p>
<p>犯了又犯的違規</p>
<p> </p>
<p>非悠悠擺渡的輕舟  只悄然經過</p>
<p> </p>
<p>分明似巨浪狂風</p>
<p> </p>
<p>吹翻了 毀壞了 卻無尤</p>
<p> </p>
<p> </p>
<p> </p>
<p> </p>
