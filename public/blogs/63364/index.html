<p>非自住房屋
北市開始實地訪查</p>
<p>（中央社記者馮昭台北31日電）財政部台北市國稅局表示，今年度非自住房屋實地訪查作業已展開，預計8月底前完成。北市國稅局呼籲受訪業者或承租者配合調查工作，詳實填報租金、實際使用面積等資料。</p>
