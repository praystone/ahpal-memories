<p>無題八首其二       李商隱　　</p>
<p>昨夜星辰昨夜風，
　畫樓西畔桂堂東。</p>
<p>身無彩鳳雙飛翼，
　心有靈犀一點通。</p>
<p>隔座送鉤春酒暖，
　分曹射覆蠟燈紅。</p>
<p>嗟余聽鼓應官去，
　走馬蘭台類轉蓬。</p>
