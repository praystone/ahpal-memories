<p>對不對、有沒有、能不能、好不好、是不是、去不去、該不該、買不買、要不要、留不留、走不走、對不對、等不等、嫁不嫁、 會不會、懂不懂、做不做、看不看、行不行、成不成、愛不愛．．．．．．為什麼，人生總是一連串二擇一的選擇題？不選，行不行？又是選擇題啊，那麼、究竟、該不該、繼續．．．</p>
