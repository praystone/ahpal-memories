<p>為 我 尋 座 忘 憂 谷
晨 風 夜 影 紫 花 天
長 空 鎖 夢 笑 月 偏
一 縷 琴 音 宿 雲 間</p>
<p>紅樓紫玫花開時候
煙鎖月華銀漢
萬千愁
難道分別斷腸時</p>
