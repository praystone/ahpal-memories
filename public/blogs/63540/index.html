<p>台北市國小實施英語教學近十年，但各校教材亂象由來已久。台北市現有一百五十二所國小，光是英語教科書審定本，種類數就高達九種，非審定本更高達廿四種；若再加上各家出版社的練習本，各國小能選擇的教科書超過卅種，形成教科書比參考書多的台北市國小英語教學亂象。</p>
