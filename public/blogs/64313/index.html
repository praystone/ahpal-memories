<p>用鍵盤輸入 &amp; # 9 8 2 5 ;
然後，再點出確定（這裡的確定是指“回復”）。
你會發現一個秘密就出現了：&quot;♡&quot;
記得要去掉空格哦.
如果出現的是數字
請再編輯一下！一定會出現的哦！
要在任務欄沒有輸入法的情況下
按shift打&amp;#，然後放開shift，
再打9825;，這樣就可以啦（千萬不要忘了分號）</p>
