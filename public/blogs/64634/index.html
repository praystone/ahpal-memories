<p>慢性病患高溫暈眩頭撞地死亡</p>
<p>更新日期:2011/08/12 04:11</p>
<p>記者林相美／台北報導</p>
<p>炎夏高溫，易影響新陳代謝及血液循環，易引發慢性病史的長者暈眩、跌倒，甚至有一名70歲長者跌倒時撞到頭部，引發腦內出血不治。</p>
<p>醫師提醒，應避免中午外出，一有呼吸急促、四肢無力、冒冷汗等症狀，儘速到陰涼處休息</p>
