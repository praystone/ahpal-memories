<p>趕跑螞蟻:</p>
<p>房間有螞蟻怎麼辦？</p>
<p>其實蒜頭對螞蟻就非常有效了 ㄏ~</p>
<p>只要在他們的路徑上放一顆切開的蒜頭</p>
<p>螞蟻馬上絕跡</p>
<p>或者把蒜頭切兩顆放在水裡</p>
<p>然後,把水拿去擦地板</p>
<p>螞蟻從此後就立刻搬家</p>
<p>因為螞蟻本身應該會怕這種味道~
這招我有試過唷~
如果家裡真的有很多螞蟻的話
不仿也可以試看看唷 ^^</p>
