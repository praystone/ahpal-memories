<p>相思淚 夢破碎
珠簾垂 又怨誰
銀燈下 玉壺葉
影孤單 人憔悴
紅夜零亂煙雲散
拂塵困人更惹煩
淡淡濛濛問天愁
蜂蝶翩飛柳邊樓
紫玫花 風中草
情關路 似飄邈
獨深情 終是擾
殘夢醒 天將曉
盼春來 冬又到
寒風蕭瑟雨飄渺
喚至愛 莫忘了
來生相遇要趁早</p>
