<p>台灣少子化情況空前嚴重，根據內政部戶政司的統計，台灣去年總生育率再創歷年新低點，跌破「一」字大關，從前年的一.○三驟降至○.八九五，平均每對夫妻一輩子生育不到一名子女。前年台灣還以○.○一的差距險勝德國，險居全球倒數第二，但去年跌破○.九大關，已經成為全球生育率最低的國家！</p>
