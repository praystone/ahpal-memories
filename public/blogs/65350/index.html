<p>為何不生？
經濟負擔是主因更新日期:2011/08/15 05:30 邱俐穎／台北報導</p>
<p>台灣生育率直直落，衛生署調查發現，無論已婚、未婚，婦女不想生小孩的理由，以經濟負擔、社會環境不穩定、沒把握做好父母角色居前三名；另國內婦女晚婚、不婚也是導致生育率下降的重要原因之一，十四年來，生育年齡更往後延了五年。</p>
