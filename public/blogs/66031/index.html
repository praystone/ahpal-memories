    <div class="blog-content"><p><strong>作者</strong>：心死</p>
<p><strong>發文</strong>：2011-08-20</p>
<p><strong>瀏覽</strong>：91 次 ｜ <strong>回應</strong>：2 則</p>
<hr>
<p>雨 輕輕的飄落</p>
<p>風 刺骨的吹著</p>
<p>獨站在孤寂的黑暗海邊上</p>
<p>遙望天邊那一顆最亮的星</p>
<p>只覺得它距離我越來越遠</p>
<p>彷彿原本是一手可觸及的地</p>
<p>轉眼變成冷傲不可親近的天</p>
<p>是啥緣故讓其變成這樣無情</p>
<p>天地無情 總有人自作多情 自古多情總為無情傷</p>
<p>欲傷他人卻先傷自我 哀 有情也好 無情也罷</p>
<p>總歸情傷人 愛讓人恨 糾纏不清直到生生世世循環</p>
