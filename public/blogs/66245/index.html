<p><strong>瀏覽</strong>：62 次 ｜ <strong>回應</strong>：2 則</p>
<hr>
<p>一天，男孩和女孩吵架了。他不再對她說&quot;我愛你&quot;，當然她也不再對他
說&quot;我也是。一天晚上，他們談到了分手的事，背對背睡下了。半夜，
天上打雷了。第一聲雷響時，他醒了，下意識地猛地用雙手去捂她的
耳朵，才發現不知何時他又擁著她。雷聲緊接著炸假裝什麼也沒發
生，他想她還愛我，不然她不會流下滿天愛的最高境界是經得起平淡的流&hellip;&hellip;年。</p>
