<p>煙霧瀰漫的飄渺
冷冷的秋隨風墬落
黯然的黑夜是你的面容
凝聚幽暗的濃霧 找不著愛之路
夢離分 無法挽回　挽不回你的心
有誰人來憐惜 情深深的我
飄落天涯的情 流逝的歲月
有誰人能看穿愛的真心
不願夢醒而墬紅塵</p>
