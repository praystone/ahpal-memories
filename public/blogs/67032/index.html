<p>我在秋天眾山間放牧詩句</p>
<p>聚在一起變成思念</p>
<p>串在一起繞成依戀</p>
<p>雲彩躲在溪壑間扮起鬼臉</p>
<p>借一點楓紅染成晚霞</p>
<p>褪一點草綠畫成水墨</p>
<p>那煙嵐遁出的雙眸還眺望著嗎？</p>
<p>那樹柳搖曳的長髮還幽香著嗎？</p>
<p>天風的大手趕路      摸黑攀峰</p>
<p>小徑的微蕊濕潤      氾成湍流</p>
<p>我在秋天眾山間呢喃詩句</p>
