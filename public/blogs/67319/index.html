<p>我在等一個人</p>
<p>一個可以把我的寂寞故事畫上休止符的人</p>
<p>一個可以陪我聽遍所有悲傷情歌</p>
<p>卻不會讓我想哭的人</p>
<p>一個我可以在她身上找出一百個缺點</p>
<p>卻還是執意要愛她的人</p>
<p>一個會對我說，我們有難一起擔</p>
<p>有苦一起嘗、有一輩子就一起過的人！</p>
<p>其實…我一直都在等妳，妳難道真的不知道嗎？</p>
