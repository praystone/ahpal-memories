<p>我喜歡一個人發呆，不是因為孤獨而是能夠全心全意的想妳那種幸福的滋味讓我陶醉我喜歡抬頭看天，不是因為寂寞而是想著我們能夠遨翔在同一片天空下那種快意的想像讓我回味。妳是頤養我精神之戀的花朵因為有妳，整個玫瑰園在我心中都已黯然失色唯有妳，開得那麼豔美與絢麗。</p>
