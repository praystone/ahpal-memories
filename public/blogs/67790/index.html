<p><strong>發文</strong>：2011-08-31</p>
<p><strong>瀏覽</strong>：34 次 ｜ <strong>回應</strong>：6 則</p>
<hr>
<p>有兩個臺灣觀光團到日本伊豆半島旅遊，路況很壞，到處都是坑洞。</p>
<p>一位導遊連聲說路面簡直像麻子一樣。</p>
<p>而另一個導遊卻詩意盎然地對遊客說：“我們現在走的正是赫赫有名的伊豆迷人酒窩大道。”</p>
<p>◎雖是同樣的情況，然而不同的意念，就會產生不同的態度。思想是何等奇妙的事，如何去想，決定權在你。</p>
