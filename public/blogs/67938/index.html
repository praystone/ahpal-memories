<p><strong>發文</strong>：2011-09-02</p>
<p><strong>瀏覽</strong>：73 次 ｜ <strong>回應</strong>：2 則</p>
<hr>
<p>當愛情由濃轉淡　再說什麼已太晚
不管心裡多遺憾　就讓你離開別阻攔</p>
<p>若是愛讓你有負擔　說明白吧別隱瞞
你心不在了怎麼辦　為何不就在這裡散</p>
<p>當愛已不再溫暖　它只是牽絆
又何苦讓它再糾纏　喔！再糾纏</p>
<p>天空為何那麼暗　愛情為何那麼難
誰能告訴我答案（現在）我的心好亂</p>
<p>有妳在的日子很開心<del>但在今夜全都變了樣</del>現在我的心好亂</p>
