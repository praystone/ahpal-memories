    <div class="blog-content"><p><strong>作者</strong>：任平生</p>
<p><strong>發文</strong>：2011-09-03</p>
<p><strong>瀏覽</strong>：118 次 ｜ <strong>回應</strong>：30 則</p>
<hr>
<p>倏然一顆流星劃過兩張白帆</p>
<p>熾熱一晚情柔串起兩人遊魂</p>
<p>氣象預報秋天啜泣唏嗦的脈搏</p>
<p>一滴水一地露   紅的葉</p>
<p>一心愁漫天霧   我的靨</p>
<p>鼻尖觸著鼻尖</p>
<p>尋覓妳的芳唇</p>
<p>那協奏曲迷途跌落黑白琴鍵</p>
<p>那四重奏甘心被琴弦綁架纏繞</p>
<p>吻著海藏住     妳的累</p>
<p>秋霜夜涼            薔薇淚雨的味</p>
<p>風挽面髮的魅</p>
<p>妳今天好美！</p>
