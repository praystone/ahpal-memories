<p>霧 霞 湮 淡。林 風 歸 晚。
朱 樓 硯 池 銀 娥。
入 心 一 賦 離 騷 處。
知 音 者、情 沐 扉 露。
星 燦 瓊 語。月 照 峰 遼。
詩 落 築 夢 琳 橋。
芳 菲 暗 許 會 心 人。
天 植 歌、暢 懷 逍 遙。</p>
