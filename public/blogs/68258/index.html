    <div class="blog-content"><p><strong>作者</strong>：楊小咩</p>
<p><strong>發文</strong>：2011-09-04</p>
<p><strong>瀏覽</strong>：86 次 ｜ <strong>回應</strong>：3 則</p>
<hr>
<p>有時候，很迷茫的去看前方，</p>
<p>明明知道那片海沒有你在，</p>
<p>卻還要固執的踏上火車，</p>
<p>去追逐那個有你不了解的愛，</p>
<p>害怕總是真實的存在，</p>
<p>精彩的孤單總是陪伴著我們 終究該明白，</p>
<p>不能再在原地徘徊，</p>
<p>不能再固執的守著不會回來的，</p>
<p>不能再掙紮著看著你的不精彩。</p>
