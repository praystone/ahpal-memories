<p><strong>發文</strong>：2011-09-06</p>
<p><strong>瀏覽</strong>：0 次 ｜ <strong>回應</strong>：0 則</p>
<hr>
<p>秋暮低吟撐起張羞赧的大網
撒向妳湛藍的雙眸
別再落淚了
別再憂鬱了</p>
<p>楓香吐紅揚起滿山片片思念
寄向妳空悵的行囊
別再流浪了
別再沮喪了</p>
<p>萬籟俱寂
風踢踏著
妳是唯一的嬌喘</p>
<p>眾弦俱靜
風撩撥著
我是唯一的呼喚</p>
<p>那深夜怎能網得住聲聲歡愉？
那幾片落葉又怎能落盡依戀？</p>
<p>打開心扉收信唷
窩在懷裡的秋天想悄悄話</p>
