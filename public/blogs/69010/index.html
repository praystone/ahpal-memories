<p>世界上有一個人</p>
<p>不見面的時候會一直惦記著她</p>
<p>見面時卻又臉紅心跳，什麼話都說不出口</p>
<p>她總是輕易地把你心揪住，讓你無法忘懷</p>
<p>也能讓你胡思亂想睡不好覺</p>
<p>但你仍然甘之如飴，因為你愛她</p>
<p>她是你最甜蜜，最甜蜜的負荷</p>
<p>這個人，叫做戀人</p>
