<p>一個人坐在海風陣陣吹來海堤上 
品嘗著帶點大海鹹鹹滋味的空氣
遠處漁船閃爍著微暗的黃色燭光
正如同心中那殘燭飄盪的生命火</p>
<p>寂寥心情仰看著天邊那雙目無神如枯槁般
似乎感受不到何神態
是愁 是悲 是苦 是慟 是哀 是傷 或是&hellip;..</p>
<p>孤寂對空欲進酒 
傲然寂寥身獨影   </p>
