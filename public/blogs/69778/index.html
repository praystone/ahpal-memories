<p>人這一輩子，開心也是一天，不開心也是一天，讓我們從快樂開始！做你想做的，愛你想愛的。記住該記住的，忘記該忘記的。改變能改變的，接受不能改變的。我們可以淡然面對，可以積極把握。不要去過份的苛求，不要有太多的奢望。做好你能做的每一件事，珍惜你身邊的每一個人。人生苦短，珍惜，珍重。</p>
