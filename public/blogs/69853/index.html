<p>夜晚我出沒在大街小巷
白晝
隱匿於城間店坊</p>
<p>世間的無奈
我不想去懂
沉重的壓力
我只想放鬆
我懶  懶的只在夜晚出沒
踏著步伐  穿梭於夢</p>
<p>好友  知己
誰知道會怎樣
曾經的要好
又是否經的住時間浪濤的震盪
不懂  也不想去懂
我只是不希望在原諒
原諒我自己的年輕莽撞
失去了你那熟悉的模樣</p>
