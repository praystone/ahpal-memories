<p>今天
早上ㄑ買早餐
叫了鐵板麵
跟冬瓜茶
因為
不喜歡竹筷子
於是
店員正要放竹筷子
「不用筷子~」
店員：「那叉子？」
「不用叉子~」
店員：「那吸管？」
「不用吸管~」
後來想想
「不對不對!!!要吸管!!!」  ))猛搖頭
他笑了&hellip;
好像被整了一樣&hellip;</p>
