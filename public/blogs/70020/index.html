    <div class="blog-content"><p><strong>作者</strong>：Grouse</p>
<p><strong>發文</strong>：2011-09-19</p>
<p><strong>瀏覽</strong>：162 次 ｜ <strong>回應</strong>：9 則</p>
<hr>
<p>每個人的記憶中，都有不堪回首的往昔</p>
<p>只是那種痛徹心靈的哀傷，別人是不易察覺到罷了</p>
<p>人生一世，情伴始終，無人能夠躲過為情所困，為情所惑，為情所繫</p>
<p>茫茫天地，浩浩宇宙間，唯情不滅，唯情最痛</p>
<p>孟婆是慈悲的，她在奈何橋上向轉世的靈魂贈喝忘情水</p>
<p>就是要讓人忘記前世，好輕鬆的前往陽間重啟來生</p>
