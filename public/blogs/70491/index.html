<p>柏拉圖說，若愛，請深愛，如棄，請徹底，不要曖昧，傷人傷己。柏拉圖說，人生最遺憾的，莫過於輕易地放棄了不該放棄的，固執地堅持了不該堅持的。柏拉圖說，我以為小鳥飛不過滄海，是因為小鳥沒有飛過滄海的勇氣，十年以後我才發現，不是小鳥飛不過去，而是滄海的那一頭，早已沒有了等待。</p>
