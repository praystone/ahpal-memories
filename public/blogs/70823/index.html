<p>款款楓飲落
秋意醉 縈繞彩雲間
箏柔紫玫曳 暗譜情弦
風卻問愁 苦唱離合
琴音傳 花瓣凝天香 意點卿容淚
明宵斜臥 相思不墜
緣緣九世 萬千晶霓
情深名份無 不怨誰 靜默永相隨
雪峰閣雙侶台 雲夢雨涵
詩韻曉月來 聆曲忘今
紅腮正暈 和顏悅心
羞纏綿輕解羅 醉依依憐</p>
