<p>天哪！才上班我就驚愕不已，剛剛在廁所看見我人生第一根白髮
歲月真是最無情的小偷！不好好紀念一下怎麼可以</p>
<p>我的髮鬢蛻出一絲白晝</p>
<p>沉溺黑夜的容顏倏然驚醒</p>
<p>歲月終於曬出幾條皺紋了</p>
<p>再也燙不出平整的回憶</p>
<p>這初雪新月</p>
<p>老是凍壞我幾首小詩</p>
<p>一開燈</p>
<p>就壞了秋天的氣氛</p>
