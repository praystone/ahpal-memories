<p><strong>發文</strong>：2011-09-26</p>
<p><strong>瀏覽</strong>：158 次 ｜ <strong>回應</strong>：27 則</p>
<hr>
<p>他向她求婚時，只說了三個字「相信我」</p>
<p>她為他生下第一個女兒的時候，他對她說「辛苦了」</p>
<p>女兒出嫁那天，他摟著她的肩說「還有我」</p>
<p>他收到她病危的那天，重複的對她說「我在這」</p>
<p>她要走的那一刻，他親吻她的額頭輕聲說「你等我」</p>
<p>這一生，他沒有對他說過一次「我愛你」</p>
<p>但愛，從未離開過</p>
<p> </p>
