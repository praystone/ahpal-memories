<p>我要和你在一起 </p>
<p> 看蒼生 望水流 
 
楓送伊人一曲
吾等伊人一生 
不悔今生頌罷 
只悔今生無緣 
低頭相思無語 
只剩一滴清流 </p>
<p> 簡簡單單的情   簡簡單單的思 </p>
<p> 可否會讓仙傾羨呢</p>
