    <div class="blog-content"><p><strong>作者</strong>：點點ㄦ☆</p>
<p><strong>發文</strong>：2011-09-28</p>
<p><strong>瀏覽</strong>：91 次 ｜ <strong>回應</strong>：11 則</p>
<hr>
<p>小的時候，我以為記得牢是真本事，過目不忘的大腦，真是天才啊！</p>
<p>長大以後，我逐漸領悟到忘得掉才是真幸福。 </p>
<p>忘不了別人的閒言閒語 — 人生會披上一層灰色陰影</p>
<p> 　</p>
<p>忘不掉傷心的往事，人格會逐漸扭曲。</p>
<p>忘比「記」難多了，「記」是聰明；「忘」是智慧、是修養。</p>
<p> </p>
<p>也許我是真的老了,忘的事是我最幸福的事呢~</p>
<p> </p>
<p> </p>
