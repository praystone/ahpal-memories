【幸福小笑話】</p>
<p>橘子深愛著柳丁，但柳丁總是躲著她…
這天，橘子終於鼓起勇氣：『是我不夠漂亮？不夠溫柔？還是你愛的是別人…』橘子強忍住淚水『為什麼你～總是躲著我？』
柳丁吞吞吐吐的說：『嗯～我媽說…說…</p>
<p>衣服太好脫的女人&hellip;都不是好女人，很容易就劈腿…』咦 ..愛豬意那個衣服別亂脫嘿！麻麻說滴</p>
