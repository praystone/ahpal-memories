<p>一個月內拔掉兩顆智齒牙醫還開玩笑說妳是在趕進度嗎
兩顆智齒都是牙醫認定很棘手的水平智齒
上上星期五拔左下智齒時
因為埋在牙肉裡太深很難拔  弄了一會太痛了
我跟兩位醫生說我不想作了
起身要落跑時結果被護士抓住
回想起來就覺得很好笑  哈哈哈&hellip;</p>
