    <div class="blog-content"><p><strong>作者</strong>：任平生</p>
<p><strong>發文</strong>：2011-10-04</p>
<p><strong>瀏覽</strong>：213 次 ｜ <strong>回應</strong>：51 則</p>
<hr>
<p>沒有一個字敢自誇說愛妳
沒有一個愛敢説多麼戀妳
就連我也不敢說有多想妳</p>
<p>只願在妳無限的秋風中
飄著片片掉落的思念
只願在妳無垠的夕照中
映著點點唱晚的舟帆</p>
<p>如果不能看著妳沉睡
那就讓我長長拖曳
用影子
記住妳璨麗的晚霞</p>
<p>如果不能在妳的心底
那就讓我緊緊跟隨
用剪子
描著妳美麗的形態</p>
<p>就像書中夾著楓葉藏著秋天
而我的心底住著妳</p>
