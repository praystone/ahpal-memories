<p>細雨 細語  你耳邊是哪種思緒</p>
<p>昨日黃花還見不見</p>
<p>說是想念扶桑的紅豔</p>
<p>慵懶的笑著甜甜</p>
<p>我知道你的心很多變</p>
<p>嘿 涼涼的風</p>
<p>是說誰的清醒正清醒</p>
<p>昨天的香片還香呢</p>
<p>你有千變萬變的旋律</p>
<p>怎害怕一曲相思情未了</p>
<p>該輪到你寂寞吧</p>
<p>我慵懶的笑著</p>
<p>嘿 秋意正濃</p>
<p>楓葉紅不紅</p>
<p> </p>
