<p>今夜風大
何止風大呀
連雨都稠了
何只風大呀
連心都揪了</p>
<p>今夜露重
何只露重呀
連酒都濃了
何只露重呀
連夢都沉了</p>
<p>今夜弦斷
何只弦斷呀
連音也啞了
何只弦斷呀
連氣也岔了</p>
<p>今夜是何夜？
沒睡好
神閃了
魂飛了
妳不見了</p>
<p>你是不是也常和我一樣就是殷切期盼她的回文
心老懸著掛著
最後她的燈卻突然滅了
謹以短詩紮著這樣的心情</p>
