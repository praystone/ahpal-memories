<p>夢想 掌心向下</p>
<p>家扶給我的一大意義</p>
<p>目前無能力的我</p>
<p>曾經這樣夢想著</p>
<p>實踐他 將是我未來的路</p>
<p>觀自在音菩薩 三世神佛不是表象</p>
<p>心不必如此懂得</p>
<p>手將化成觀音之手助世人</p>
<p>喊一聲 阿彌佗佛</p>
<p>風 冷了 但心不冷</p>
<p>天 變了 但心不變</p>
<p>牽手^^ 一起走</p>
