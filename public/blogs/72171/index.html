<p>遙望妳已在天涯　回首成風中一幅畫
捲起飄落的回憶　卻捲不走思念的心
歲月裡的彩霞　就像握在手中的塵沙
年年月月的流去　換來一生的牽掛
那些年少的情懷　就像一幅不褪色的畫
我深深的愛過　也記得淚曾經為妳流
相逢應該無盡頭　那堪在今生就錯過
能不能剪下一段情　別帶走&hellip;&hellip;！</p>
