    <div class="blog-content"><p><strong>作者</strong>：SHAWEE</p>
<p><strong>發文</strong>：2011-10-09</p>
<p><strong>瀏覽</strong>：94 次 ｜ <strong>回應</strong>：2 則</p>
<hr>
<p>懂你的人，</p>
<p>會用你所需要的方式去愛你。</p>
<p>不懂你的人，</p>
<p>會用他所需要的方式去愛你。</p>
<p>於是，</p>
<p>懂你的人，</p>
<p>常是事半功倍，</p>
<p>他愛得自如，</p>
<p>你受得幸福。</p>
<p>不懂你的人，</p>
<p>常是事倍功半，</p>
<p>他愛得吃力，</p>
<p>你受得辛苦。</p>
<p>兩個人的世界裡，</p>
<p>懂比愛，</p>
<p>更難做到</p>
