<p>你看到的眼不是我的眼</p>
<p> </p>
<p>你猜測的心不是我的心</p>
<p> </p>
<p>逐漸縮小的是我的世界</p>
<p> </p>
<p>就讓我回到塵埃裡去</p>
<p> </p>
<p>為你遮千萬分之ㄧ的烈陽</p>
<p> </p>
<p>為你擋百萬分之ㄧ的雨水</p>
<p> </p>
<p>就讓我回到塵埃裡去</p>
<p> </p>
<p>落在不完美的完美裡</p>
<p> </p>
<p>細數最幸福的回憶</p>
<p> </p>
<p>再慢慢慢慢地</p>
<p> </p>
<p>飄進忘魂傘</p>
<p> </p>
<p>來生來世不復記憶</p>
<p> </p>
