<p>當我愛妳ㄉ時候</p>
<p>你是如何傷我ㄉ心</p>
<p>當我留著淚盼你回頭ㄉ時候</p>
<p>你依然徹夜未歸</p>
<p>當我抱著你ㄉ時候</p>
<p>你卻推開我ㄉ雙手</p>
<p>當我想你ㄉ時候</p>
<p>你在哪裡</p>
<p>為甚麼</p>
<p>我決定離開ㄌ</p>

<p>你知不知道</p>
<p>這一切都來不及ㄌ</p>
<p>我不可能再回頭ㄌ</p>
<p>不可能再讓你傷我ㄉ心ㄌ</p>
<p>我愛你ㄉ日子已經不再有ㄌ</p>
<p>對不起</p>
<p>請原諒我</p>
