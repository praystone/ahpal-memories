<p><strong>發文</strong>：2011-10-14</p>
<p><strong>瀏覽</strong>：55 次 ｜ <strong>回應</strong>：2 則</p>
<hr>
<p>忘記那個人，</p>
<p>不如忘記自己，</p>
<p>告訴自己，</p>
<p>不是怕他忘記，</p>
<p>而是怕他有一天重新把你想起。</p>
<p>歲月帶走的是記憶，</p>
<p>但回憶會越來越清晰。</p>
<p>真的有一天，</p>
<p>他回過頭來告訴你，</p>
<p>他一直在惦記你，</p>
<p>千萬不要相信，</p>
<p>因為，</p>
<p>他已經不是原來的他，</p>
<p>而你，</p>
<p>也不再是過去的你。</p>
