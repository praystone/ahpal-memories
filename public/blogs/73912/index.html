<p>有一天，老婆跟老公說要去朋友家打麻將，</p>
<p>老公心裡雖然不太樂意，也只好讓她去。</p>
<p>結果老婆賭至凌晨才回家，為了不擾醒丈夫起見，</p>
<p>她於是先在客廳裡脫光了衣服，然後再進臥室。</p>
<p>不料一進臥室老公剛好醒來，</p>
<p>一見了一絲不掛的老婆，道：</p>
<p>「太過份了吧？妳竟然輸得精光回來！」</p>
