<p>我可以在小說裡舒發我的悲傷</p>
<p>但是 回到現實面我依然空虛&hellip;</p>
<p>我可以在小說裡盡情哭泣狂笑</p>
<p>但 我不敢再真實世界哭泣歡笑</p>
<p>我能在虛假世界中大聲咆哮</p>
<p>可 我不能在人前展現真我</p>
<p>悲哀吧&hellip;.</p>
