<hr>
<p>剪紙作品你一定看得不少了，但是看到這一組美麗的剪紙作品，相信你還是會忍不住驚嘆一下。在如此心靈手巧的創作者手下榼榮榻槓，平凡的白紙開始變身成各式各樣各樣超有創意的情景。從細節到造型，都像有了生命力一般緊緊抓住你的目光。</p>
<p> </p>
<p>相當有意思的巧思</p>
<p>除了精美雕工外,其成品和其空位經擺飾而產生不同效果</p>
<p>像第五張的對比也蠻強烈</p>
<p>被囚禁的天使和聖潔的天使</p>
