<p>在愛情沒開始以前，你永遠想像不出會那樣地愛一個人。 在愛情沒結束以前，你永遠想像不出那樣的愛也會消失。 在愛情被忘卻以前， 你永遠想像不出那樣刻骨銘心的愛也會只留淡淡痕跡。 在愛情重新開始以前， 你永遠想像不出還能再一次找到那樣的愛情。</p>
