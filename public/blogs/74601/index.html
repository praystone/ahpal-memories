    <div class="blog-content"><p><strong>作者</strong>：凡人</p>
<p><strong>發文</strong>：2011-10-28</p>
<p><strong>瀏覽</strong>：99 次 ｜ <strong>回應</strong>：0 則</p>
<hr>
<p>愛就是不問值得不值得。我們的愛，像一生那麼短，像一個承諾那麼長。</p>
<p>　　　一生愛過很多次，情深不過那一回，最初的愛，永遠的愛……</p>
<p>　　　他曾對我許下一句非常溫柔的諾言，而那輪山月，曾照過他在林中，</p>
<p>　　　年輕的皎潔的容顏，用芳香的一瞬，來換我今日所有的憂傷和寂寞，</p>
<p>　　　在長歌痛苦的人群裡，他可知道我仍是啊！無悔的那一個。</p>
