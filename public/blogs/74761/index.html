<p>湖南礦難 被困29名礦工全部喪生中廣 – 2011年10月30日 下午5:38</p>
<pre><code>大陸湖南衡山縣煤礦氣爆意外，失蹤的1名礦工證實死亡，使得罹難人數增加到29人。
</code></pre>
<p>事發於昨天傍晚6點多，當時有35名礦工在井下，只有6人獲救。</p>
<p>出事的煤礦是湖南衡陽市國有礦山企業，證照齊全，屬合法礦井。事故原因還要調查。</p>
