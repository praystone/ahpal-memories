<p>笑是每天的維他命~《考試》
考試的時候，老師特地允許看課本。
但是某生，依然還是把課本藏在桌面下，攤在大腿上抄。
老師看到了，感到不解，特地走過來 &hellip;. 關心地對他說：「您，為什麼，不拿上來抄呢？像現在這樣，不是很累嗎？！」
學生答：「可是∼，這樣子，我比較習慣呀！」</p>
