<p><strong>發文</strong>：2011-11-10</p>

<hr>
<p>是誰在叩門呀？
滴滴答答的</p>
<p>是誰在敲窗呀？
欷欷唆唆的</p>
<p>麥子都收割了
怎還扛著淚呀？</p>
<p>妳的飛輪駛離了台北
輾碎了思念
難怪今晚風雨好大</p>
<p>海是夜的一面鏡子
但怎麼也瞧不見冬天的影子</p>
<p>我是夜的一畦夢田
妄想淒冷中種出春天的溫暖</p>
