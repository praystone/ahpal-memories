<p><strong>發文</strong>：2011-11-11</p>
<p><strong>瀏覽</strong>：127 次 ｜ <strong>回應</strong>：4 則</p>
<hr>
<p>農場，最快的自己處理方式就是用鏟子挖掉有問題的種子，該種子就不要再種植了，因為某些稀有種子有FLASH衝突。</p>
<p>牧場，最快的自己處理方式就是強制捐贈掉有問題的動物，該動物就不要再飼養了，因為某些稀有動物有FLASH衝突。</p>
<p>以上處理完之後，請記得按 F5  刷新頁面才能生效。</p>
