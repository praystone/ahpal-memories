<p>快樂的 心情 總會 有許許多多的事情 而組成
煩腦的 事情 卻會 因為 一件小小的事情 而出現
不開心的 我 開始 慢慢 開心 因為 有些事情 我已經開始期待
美好的 雖然 不一定 有 但是 至少 不會再是 最壞的
當 艱苦 過後 隨之而來 會是 甘甜的
當我開始 懂得 所有的 開始 跟 結果 時
也許 就已經 要有所 領悟 一切</p>
