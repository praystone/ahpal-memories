<hr>
<p>有個人帶全家一起到耶路撒冷去渡假,他的岳母突然去世了,他必須安排把遺體運回國</p>
<p>領事館說用船運回去要5000元美金,就地埋在耶路撒冷只要150美金</p>
<p>深思熟慮後, 他決定將遺體運回國去,領事館說：天吶!你一定很愛你岳母喔？</p>
<p>他說：也沒那麼愛…只是我想起來,許多年前有個人被埋在這裡,三天後,他竟然復活了, 我可不能冒這個險</p>
