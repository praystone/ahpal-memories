<p><strong>發文</strong>：2011-11-12</p>
<p><strong>瀏覽</strong>：70 次 ｜ <strong>回應</strong>：1 則</p>
<hr>
<p>你會陷入情不自禁的旋渦中，</p>
<p>情不自禁念他的好，</p>
<p>情不自禁回憶和他一起走過的時光，</p>
<p>情不自禁為他做一些事情，</p>
<p>情不自禁在乎著他的一切。</p>
<p>同樣，他愛不愛你，</p>
<p>你也是能感覺到的，</p>
<p>而且這種感覺相當真切和準確的。</p>
<p>你不用騙自己，不用勉強自己，</p>
<p>如果真的不行，你要學會轉身。</p>
