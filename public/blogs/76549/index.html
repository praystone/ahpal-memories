<p>幸福其實很簡單，
就在你眼中，只要用心就能捕捉；
就在你掌心，只要合手就能把握；
就在你腳上，只要移步就能到達 &hellip;
可是很多時候，我們望眼欲穿，
我們苦苦挽留，我們東奔西走，
卻總是感覺幸福很遙遠
那是因為我們看錯了方向，握錯了手，走錯了路。
不屬於自己的不要強求，已經得到的好好珍惜。</p>
