<p>是怎樣</p>
<p>有位小姐，開車開到一半的時候，
車子突然在路中央熄火，
怎麼發也發不動。</p>
<p>站在一旁的交通警察看了她好久，
看著紅燈變綠燈、綠燈變紅燈…
那位小姐還是停在路中央，動也不動。</p>
<p>於是交警忍不住走過去問
那個 小姐：「是怎樣？沒有妳喜歡的顏色嗎？」</p>
