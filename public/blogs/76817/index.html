<p>曾經每一段真心的感情、
每一個溫暖過我們的畫面、
每一次在某個深夜站在街燈下說過的愛、
都沒有可能回到過去、
唯一能回去的、只是深藏于心底的記憶。
當一次次把你從記憶深處抹去、
又一次次忍不住把你想起、
我知道、我總是活在回憶裡；
我知道、我一直懷念過去；
我知道、忘記你就必須先忘記自己。</p>
