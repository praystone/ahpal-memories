<p>笑是每天的維他命~◎極冷對話
小藍：「一氧化碳它哥叫什麼？」
小蘋：「二氧化碳。」
小藍：「那豆油（醬油的台語）他哥叫什麼？」
小蘋：「鹽嗎？」
小藍：「不是… 」
小蘋：「醋… ？」
小藍：「也不是… 」
小蘋：「那到底是什麼？」
小藍：「豆油哥（醬油膏）」</p>
