<p>笑是每天的維他命~◎老少配
有位80幾歲的老富翁娶了個年輕少婦。
某天少婦早上起來，發現丈夫老富翁已死在床上！
少婦非常驚慌的奪門而出並大喊：
「陳嫂！陳嫂！不用煮老爺的早餐了！陳嫂… 」</p>
