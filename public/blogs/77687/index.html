<p>夜晚時分
雨落時分
思念時分
點點滴滴的是鐘聲
滴滴答答的不是雨聲
我只想話有聲為無聲
空想起	幾回度	木然回首
卻一無所知
輕語者	雨中立	思索萬千
卻垮在在乎
莫放棄	致高望	遠眺山水
卻忘乎一切
輕輕落下的是步伐聲
沉重想起的是曾來過
我
活在現實中	滯留回憶中
尋找唯一或未來</p>
