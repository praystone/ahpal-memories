<p>國民年金法今年6月29日修正公佈，將保險費由原本按月計算，改為按日計算，並經行政院訂定從101年1月1日起施行。換言之，國民年金從101年1月的保費開始，將按照民眾實際參加國保天數計收，不會再產生勞保中斷1、2天就被收取整個月國保保費的情況。</p>
