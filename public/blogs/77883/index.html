<p>笑是每天的維他命~◎誰外遇？
老陳「昨晚真倒楣。」老李：「怎麼了」
老陳「昨晚我早點回家，像以往一樣，我總喜歡在黑暗中抱住我家女佣。」
老李「那又怎樣？」老陳「想不到昨晚抱住的竟是我老婆呀」
老李「那也沒關係啊！」老陳「可是我老婆卻說『小馮！老陳快回來了，你還不快走』」</p>
