        </div>

    <div class="blog-content"><p><strong>作者</strong>：無心</p>
<p><strong>發文</strong>：2011-12-02</p>
<p><strong>瀏覽</strong>：43 次 ｜ <strong>回應</strong>：4 則</p>
<hr>
<p>如畫江山，狼煙失色。金戈鐵馬，爭主沉浮。</p>
<p> </p>
<p>倚天萬里須長劍，中宵舞，誓補天！天馬西來，都為翻雲手。</p>
<p> </p>
<p>握虎符挾玉龍，羽箭射破、蒼茫山缺！道男兒至死心如鐵。</p>
<p> </p>
<p>血洗山河，草掩白骸，不怕塵淹灰，丹心映青冥！”</p>
<p> </p>
<p> </p>
<p> </p>
<p>待紅樓碧水重入畫，喚纖纖月</p>
<p> </p>
<p>空谷清音、桃花水</p>
<p> </p>
<p>卻總是、雨打風吹流雲散。</p>
