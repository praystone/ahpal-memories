<p>挖嘞財神廟還真是有夠遠
那司機開車還真是有夠趕
只見不論眼前燈號是紅燈還是綠燈 小黃全都當綠燈 全速前進
如同三太子踩著風火輪 以時速120km/h 直直駛都不用停 
三線道當成一線道開 蓁是有夠膽大 害我坐在車上也直冒冷汗 讓我嚇出一身血汗暴汗外加成吉斯汗&gt;&lt;&quot;</p>
