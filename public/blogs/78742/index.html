<p>從伊莉至亞寶已有數月.因為不擅於互動.適應的不算理想.幸而好友多為伊莉人.總有些熟悉感不致感覺突兀.因沉默少言大概沒什麼存在感..也因此常覺得自己只是加入亞寶而沒有融入這裡.或許是時間不夠長吧！或許…也因為如此.這期間發生許多紛紛擾擾得以旁觀者角度審度.但不予置評.</p>
