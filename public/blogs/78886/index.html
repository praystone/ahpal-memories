<p><strong>發文</strong>：2011-12-14</p>
<p><strong>瀏覽</strong>：143 次 ｜ <strong>回應</strong>：6 則</p>
<hr>
<p> </p>
<p>三月七日沙湖道中遇雨。雨具先去，同行皆狼狽，余獨不覺，已而遂晴，故作此詞。</p>
<p> </p>
<p> </p>
<p> </p>
<p>莫聽穿林打葉聲，何妨吟嘯且徐行。</p>
<p> </p>
<p> </p>
<p>竹杖芒鞋輕勝馬，誰怕？</p>
<p> </p>
<p>一蓑煙雨任平生。</p>
<p> </p>
<p>料峭春風吹酒醒，微冷，山頭斜照卻相迎。</p>
<p> </p>
<p>回首向來蕭瑟處，歸去，也無風雨也無晴。</p>
<p> </p>
<p> </p>
<p> </p>
