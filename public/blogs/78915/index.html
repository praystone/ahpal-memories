<hr>
<p>信任一個人有時需要許多年的時間。</p>
<p>因此，有些人甚至終其一生也沒有真正信任過任何一個人，
倘若你只信任那些能夠討你歡心的人，那是毫無意義的；
倘若你信任你所見到的每一個人，那你就是一個傻瓜；
倘若你毫不猶疑、匆匆忙忙地去信任一個人，
那你就可能也會那麼快地被你所信任的那個人背棄。</p>
