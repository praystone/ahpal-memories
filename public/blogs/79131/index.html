<p>中廣 – 2011年12月17日 上午11:34</p>
<p>大陸遼寧省鞍山師範學院82名學生集體食物中毒，目前仍有9人留院觀察。</p>
<p>學生在兩天前開始，陸續出現嘔吐、發燒和腹瀉等症狀，到醫院求醫，懷疑是急性腸炎，衛生部門還在調查原因。</p>
