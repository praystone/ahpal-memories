<p>終於有一天 &hellip;</p>
<p>我也可以放掉當年那麼多不懂。</p>
<p>終於有一天 &hellip;</p>
<p>我也可以再對你微笑。</p>
<p>終於有一天 &hellip;</p>
<p>無論誰、在哪裏、再提及你的消息、</p>
<p>我都可以笑笑、心裏沒有一點漣漪。</p>
<p>不要去恨一個你愛過的人、</p>
<p>不要追問分手的理由、</p>
<p>不要懇求複合的可能。</p>
<p>轉個身、讓自己快樂那才是最真的。</p>
