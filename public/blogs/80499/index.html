<p>一隻會寫情書的雨燕悄悄在雨季中思索
該從何處下筆
是水流的源頭還是雲端開始</p>
<p>一張會說再見的椅子
慢慢空出了位置
該從何時開口
是進門時還是轉身離去的霎那</p>
<p>一片會唱歌的樹葉
輕輕的擺動身軀
該從哪句唱起
是愛情的來臨還是夢境的幻滅</p>
<p>一砬會跳舞的砂石
靜靜的在等候
該從何方舞起
是音樂響起還是愛人的到臨</p>
