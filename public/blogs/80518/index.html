<p><strong>發文</strong>：2012-01-08</p>
<p><strong>瀏覽</strong>：95 次 ｜ <strong>回應</strong>：8 則</p>
<hr>
<p>海芋尚未展開燦爛一朵朵的雲白先來等待
等一場春天曼妙的樂章
雲不在深處  在仰頭的天際</p>
<p>茉莉花兒還在沉睡
一朵朵的浮雲清新可愛
預告著夏天火辣的舞曲
雲不在深處  在爽朗的清晨</p>
<p>雲深處  不是雨霖霖 
是一顆顆小小的水珠
是寶貝在心中的珍珠</p>
