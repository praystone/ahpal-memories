<p>不落雨的灰色天空
隱匿著淡淡哀愁</p>
<p>收拾起起落落</p>
<p>讓雲朵浮上心頭</p>
<p>承認了錯 勇敢挺胸</p>
<p>失敗了痛 越挫越勇</p>
<p>來去的人忘了臉孔</p>
<p>我還能夠溫暖的感受</p>
<p>不落雨的灰色天空</p>
<p>劃開了新的夢</p>
<p>替它採了芳香朵朵</p>
<p>給它漆上一道彩虹</p>
<p>點亮每盞燭火</p>
<p>讓每顆心不再寂寞</p>
