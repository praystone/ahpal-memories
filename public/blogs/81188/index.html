    <div class="blog-content"><p><strong>作者</strong>：舞癡癲</p>
<p><strong>發文</strong>：2012-01-16</p>
<p><strong>瀏覽</strong>：4 次 ｜ <strong>回應</strong>：0 則</p>
<hr>
<p>悲傷只有這一夜　遙遠的記憶</p>
<p> </p>
<p>感情離別秋夜雨　散場的空虛</p>
<p> </p>
<p>懷念的味道　踏入的是自己的思念</p>
<p> </p>
<p>如今的昔日　是一段又一段的落幕</p>
<p> </p>
<p>依舊瞭解　但卻無法嘗試</p>
<p> </p>
<p>認知不同感觀　原來這是如此這般</p>
<p> </p>
<p>四方空間裡　裝載著滿滿不願說出的清醒</p>
<p> </p>
<p>原來不是冰封選擇玫瑰</p>
<p> </p>
<p>而是玫瑰選擇了冰封</p>
