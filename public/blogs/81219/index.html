<p>君心似吾心　</p>
<p> </p>
<p>問君何來了心意</p>
<p> </p>
<p>君曰：妾身心海浪濤濤　雖不易見　但仍可聽聞海浪聲</p>
<p> </p>
<p>問君心海如何起</p>
<p> </p>
<p>君曰：一絲一髮三千夢　牽一髮動全身</p>
<p> </p>
<p>觀其所言　彷彿驚夢</p>
<p> </p>
<p>會心一笑而淡之</p>
<p> </p>
<p>夜雨擾人夢　回想過往言語在心頭</p>
<p> </p>
<p>天下之人何其多　知音不過兩三個</p>
