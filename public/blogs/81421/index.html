<p>因為夢想</p>
<p>所以我是一棵樹</p>
<p>眷戀藍色天空</p>
<p>分享流動雲朵</p>
<p>刻劃白晝的故事</p>
<p>守護黑夜的秘密</p>
<p>或靜或動</p>
<p>再不是傳說</p>
<p>因為甦醒了春風</p>
<p>因為暖和了寒冬</p>
<p>所以我只是一棵樹</p>
<p>夢想起飛</p>
<p>從留住一片雲開始</p>
