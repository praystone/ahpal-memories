<p>愛並非以相處有多麼甜蜜恩愛來判定；
 也不是以想跟對方在一起的期盼多深，
 或者以彼此分開會有多麼痛苦來衡量。
 愛的存在，是費心思量以對方幸福為唯一前提，
 即便甜蜜不再、期盼落空，甚或痛苦欲絕，
 祇要最終對方能獲得真實幸福都願意全力促成—
 這種為對方著想，為自我求得愛的完全，才是真愛所致！</p>
