<p>一條筆直的地平線上
綻放 <br>
一束光芒。</p>
<p>蛋黃般的旭日升起，
用曙光劃破天際。
天空的月兒   被光驅離了
天空的星斗   被旭日佔據了</p>
<p>麻雀醒了
掠過街道問早
昨夜的露珠在樹葉上躺著</p>
<p>人們醒了
慢慢地
開始新的生活</p>
