<p>龍頭高高翹，祝福早來到；</p>
<p>龍尾快快搖，如意祥雲繞；</p>
<p>龍爪輕輕撓，新年降吉兆；</p>
<p>龍嘴微微笑，鴻運似春潮；</p>
<p>龍鬚翩翩飄，團圓樂陶陶。</p>
<p>爆竹聲中辭舊歲　梅花香裡報新春</p>
