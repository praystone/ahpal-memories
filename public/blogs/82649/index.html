    <div class="blog-content"><p><strong>作者</strong>：飛翔</p>
<p><strong>發文</strong>：2012-01-28</p>
<p><strong>瀏覽</strong>：69 次 ｜ <strong>回應</strong>：6 則</p>
<hr>
<p>夢中那聲呼喚勾起了模糊記憶</p>
<p>這串淚是前因還是後果</p>
<p>穿越時空的旅者啊</p>
<p>為什麼你不帶走我僅剩的靈魂</p>
<p>讓那殘餘的回憶綑綁身體</p>
<p>相愛是人間必然</p>
<p>而我該定位於你的哪個方向</p>
<p>灼灼之眼焚燒著迷惘的心</p>
<p>我是我 你不是你</p>
<p>交錯在這時空注定悲劇</p>
<p>那透徹的醒悟在你離開之後</p>
<p>滴滴淚痕絞刮著血脈</p>
<p>遺忘 甦醒 遺忘</p>
<p>註&ndash;本篇記述未來人落入人間的愛情</p>
