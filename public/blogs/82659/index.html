<p>原來某些人的臉書塗鴉牆天生就這麼養尊處優,天生就這麼驕貴,天生這麼體 弱多病&hellip;.只要有人來留言&hellip;.就馬上發神經把對方當仇 人&hellip;&hellip;隨便找個莫須有的荒唐理由抹黑別人還要惡意封鎖別人或退別人好友押&hellip;.. 而且還不會覺得自己這麼作有錯&hellip;.好像別人和他打交道是對方活該&hellip;.</p>
