<p>好愛吃~椰奶年糕</p>
<p>下午在家整理櫥櫃理的罐頭，上回超市打折，一口氣買了三打蕃茄粒罐頭，這種罐頭超好用的，蕃茄炒蛋、燉牛肉湯、倒在果汁機裡打就成了蕃茄汁，還可以做披薩醬汁，用途多多哪！</p>
<p>整理時看到一罐椰漿，昨天才在櫃子裏看到一包糯米粉，嘿！正好拿來做個椰奶年糕嘛！乒乒乓乓，做好啦！很好吃哩！</p>
