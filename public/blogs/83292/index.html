<p>本字歌 </p>
<p>健康為萬事之本，學問為濟世之本；</p>
<p>整潔為形象之本，孝順為濟家之本；</p>
<p>仁愛為接物之本，服從為負責之本；</p>
<p>禮節為交際之本，和平為處世之本；</p>
<p>勤儉為富足之本，信義為立業之本；</p>
<p>助人為善良之本，忠勇為愛國之本；</p>
<p>有恆為成功之本，道德為聲譽之本；</p>
<p>心術為思想之本，友情為涉世之本；</p>
<p>敬業為成事之本，公正為風氣之本。</p>
