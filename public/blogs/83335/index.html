<p>我單身，但不寂寞</p>
<p>最快的腳步不是跨越 ，而是繼續；
最慢的步伐不是緩慢 ，而是徘徊；
最好的道路不是大道 ，而是小心；
最險的道路不是陡坡 ，而是陷阱；
最大的幸福不是得到 ，而是擁有；
最好的財富不是金錢 ，而是健康；
最棒的祝福不是將來 ，而是現在；
最好的選擇不是擁有，而是放手。</p>
