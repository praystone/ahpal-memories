<p>一對情人50年後相見，回憶從前，感慨萬千，就再溫存一番。
半小時後，老頭子感歎:
一江春水已流乾，兩座高山成平川，昔日風景今不再，只剩兩顆葡萄乾。
老太婆感歎:
枯草堆裡到處翻，始終不見槍和蛋，歲月滄桑不饒人，只見一根蘿蔔乾。</p>
<p>XD</p>
