<p>【女人三字經】</p>
<p>多活動，少窩家。走出去，一枝花。待在家，成老媽。</p>
<p>逛逛街，把錢花。找男生，說說話。嬌滴滴，笑哈哈。</p>
<p>人再忙，把妝化。覺多睡，錢猛花。給誰省，別傻瓜。</p>
<p>別等到，耳眼花。衣再好，腰成蝦。飯再好，沒有牙。</p>
<p>錢再多，床上爬。情再好，感覺差。人再好，豆腐渣！</p>
