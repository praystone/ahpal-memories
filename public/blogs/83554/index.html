<p><strong>發文</strong>：2012-02-04</p>
<p><strong>瀏覽</strong>：42 次 ｜ <strong>回應</strong>：2 則</p>
<hr>
<p>一個人走，一個人睡，一個人思索，一個人沉醉。</p>
<p>一個人忙，一個人累，一個人煩躁，一個人體會。</p>
<p>從希望到絕望，盼望到失望。從夢想到狂想，妄想到別想。</p>
<p>我需要的其實並不多。</p>
<p>難過時一句安慰，得意時一句讚賞，累了有一個肩膀靠，</p>
<p>傷心了有一個溫柔的懷抱。</p>
<p>其實，我要的幸福就這麼簡單。</p>
