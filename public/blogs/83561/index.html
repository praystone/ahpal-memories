        <div class="blog-meta">

            <span>📅 2012-02-04</span>
        </div>

    <div class="blog-content"><p><strong>作者</strong>：SHAWEE</p>
<p><strong>發文</strong>：2012-02-04</p>
<p><strong>瀏覽</strong>：66 次 ｜ <strong>回應</strong>：4 則</p>
<hr>
<p>不知不覺中，突然有種這樣的感覺，不是不愛，是不能愛。</p>
<p>走進一個人的世界，哭著，想著，戀著，笑著，講述著，
你總是看著，沒有說過一句話。</p>
<p>因為有你，所以渴望。</p>
<p>但從那些隻字片語中聽到了失望，
於是說服自己習慣獨處，習慣一個人默默行走。</p>
<p>不是不想愛，是不能愛。
因為怕傷人，也怕被傷。</p>
