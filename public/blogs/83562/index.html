    <div class="blog-content"><p><strong>作者</strong>：SHAWEE</p>
<p><strong>發文</strong>：2012-02-04</p>
<p><strong>瀏覽</strong>：60 次 ｜ <strong>回應</strong>：3 則</p>
<hr>
<p>一件事，就算再美好，
一旦沒有結果，就不要再糾纏，久了你會倦，會累；</p>
<p>一個人，就算再留念，
如果你抓不住，就要適時放手，久了你會神傷，會心碎。</p>
<p>有時，放棄是另一種堅持，
你錯失了夏花絢爛，必將會走進秋葉靜羌。</p>
<p>任何事，任何人，都會成為過去，不要跟它過不去，
無論多難，我們都要學會抽身而退。</p>
