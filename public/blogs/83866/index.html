<p>打動的沉思像驚嚇的鴿子
竄流著慾望&ndash;甦醒</p>
<p>這不成熟的吻
原來叫做幸福
共撐把傘就是知足
牽著的手
誰能允許默默棄置</p>
<p>對我說著
你 一定要幸福
畢竟愛不是都能風雨無阻
咀嚼苦澀
從舌根痛到舌尖</p>
<p>戰慄著分分秒秒
總有一刻是分離
目送你遠去
收好
我的心</p>
<p>  </p>
