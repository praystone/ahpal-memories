    <div class="blog-content"><p><strong>作者</strong>：飛翔</p>

<p>風吹的很疾  霧已經散去</p>
<p>冷的手  放哪裡都不對</p>
<p>只好任由顫抖</p>
<p>時間永遠不夠</p>
<p>春風卻還延續著冬的凜冽</p>
<p>傻呼呼的唱歌</p>
<p>聲音飄的不夠遠</p>
<p>誰能認真接收</p>
<p>是因為寒冷還是因為記憶</p>
<p>調不成調  曲不成曲</p>
<p>就一秒的心悸</p>
<p>空白的斷斷續續</p>
<p>你的剪影</p>
