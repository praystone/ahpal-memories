<p>這是一個秘密</p>
<p>昨兒雨絲帶來的消息</p>
<p>我只能偷偷的  </p>
<p>偷偷的不經意告訴你</p>
<p>關於紫色的迷情</p>
<p>如同我的美麗</p>
<p>愛是愛的濃郁  恨是恨的徹底</p>
<p>請守住這秘密</p>
<p>蝶兒最容易竊聽</p>
<p>蜂兒最喜歡私語</p>
<p>還有滴落的相思豆</p>
<p>恣意宣染了愁緒</p>
<p>關於紫色的迷情</p>
<p>掩沒秘密的覺醒</p>
<p>昨兒的雨絲疲累了</p>
<p>卻醉在我的紫色長袍裡</p>
