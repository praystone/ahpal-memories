<hr>
<p>1.職場：先升值，再升職；2.溝通：先求同，再求異；
3.執行：先完成，再完美；
4.學習：先記錄，再記憶； 
5.設計：先仿造，再創造； 
6.創業：先成長，再成功； 
7.發展：先站住，再站高； 
8.人際：先交流，再交心；
9.先做好自己，再要求別人； 
10.先解決心情，再解決事情。</p>
<p>你同意嗎？ </p>
<p>(文:李嘉誠)</p>
