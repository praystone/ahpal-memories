    <div class="blog-content"><p><strong>作者</strong>：89psi</p>
<p><strong>發文</strong>：2012-02-09</p>
<p><strong>瀏覽</strong>：44 次 ｜ <strong>回應</strong>：6 則</p>
<hr>
<p> </p>
<p> </p>
<p>你我皆凡人　生在人世間　</p>
<p>終日奔波苦　一刻不得閒</p>
<p>（你）既然不是仙　難免有雜念　</p>
<p>道義放兩旁　（把）利字擺中間</p>
<p>多少男子漢　一怒為紅顏　</p>
<p>多少同林鳥　已成（了）分飛燕</p>
<p>人生何其短　何必苦苦戀　</p>
<p>愛人不見了　向誰去喊冤</p>
<p>問你何時曾看見　這世界為了人們改變</p>
<p>有了夢寐以求的容顏　是否就算是擁有春天</p>
<p> </p>
