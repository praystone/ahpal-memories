<p>每個人都有傷心難過的時候，</p>
<p>有時我們會驚奇的發現，</p>
<p>每次在你難過時聽你哭訴，</p>
<p>陪你傷心的總是那麼幾個人。</p>
<p>在你快樂時，他們也許不會出現，</p>
<p>但當你難過時，</p>
<p>他們總是第一時間出現在你身旁，</p>
<p>好朋友是一輩子的事&hellip;</p>
