<p>不是斷了的章節</p>
<p>也</p>
<p>不是重疊的思念</p>
<p>沒有縱橫交錯</p>
<p>何來是是非非</p>
<p>罷了</p>
<p>第一層黑水潾潾</p>
<p>誰住在第二層嘆息</p>
<p>我在第三層駐足</p>
<p>會聽見第四層的哭泣</p>
<p>眼淚收拾在第五層的無情</p>
<p>發夢於第六層的涼意</p>
<p>寂寞第七層的空虛</p>
<p>第八層最接近誰的天空</p>
<p>愛的心卻在九霄雲外</p>
