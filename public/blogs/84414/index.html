<p>生活，是用來經營的，而不是用來計較的；</p>
<p> </p>
<p>感情，是用來維繫的，而不是用來考驗的；</p>

<p> </p>

<p> </p>
<p>謊言，是用來擊破的，而不是用來粉飾的；</p>
<p> </p>
