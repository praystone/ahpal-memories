    <div class="blog-content"><p><strong>作者</strong>：飛翔</p>
<p><strong>發文</strong>：2012-02-11</p>
<p><strong>瀏覽</strong>：81 次 ｜ <strong>回應</strong>：10 則</p>
<hr>
<p>我不知道時光該如何往回走</p>
<p>時光的方向是怎樣的結構</p>
<p>默默回頭黑鴉鴉的記憶</p>
<p>靜靜向前白茫茫的旅途</p>
<p>筆直的心總是容易斷裂</p>
<p>學不會彎彎曲曲</p>
<p>固執還是不願意妥協</p>
<p>你知道距離會有多麼駭人</p>
<p>跨不過的到底是什麼</p>
<p>誰也說不上來</p>
<p>只好感嘆緣分</p>
<p>究竟你的傷痕深</p>
<p>還是我的嘆息沉</p>
<p>時間的秘密在哪裡藏匿</p>
<p>我很想遺忘這裡</p>
<p>回到原始的過去</p>
