<p>最近NBA林書豪很火紅&hellip;
日前看到彰化新聞報導&hellip;
聽說彰化立委..鄭汝芬&hellip;是林書豪&hellip;的表姑</p>
<p>當下我就跟我姐說&hellip;問看看&hellip;說不定有親企關係
因為我姐夫老家也在附近&hellip;.正好也是姓林呢</p>
<p>數日後&hellip;傳來訊息
果然..是有親企關係
我姐夫算是林書豪的&hellip;堂哥</p>
<p>因為林書豪的爺爺與姐夫的爺爺是親兄弟</p>
<p>哈..哈&hellip;.終於..免強..攀到一點關係</p>
