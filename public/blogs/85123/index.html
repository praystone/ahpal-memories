<p>沒有迷失的雲朵
沒有桀傲不遜的風</p>
<p>半睡的白日夢</p>
<p>甦醒的花園中</p>
<p>飛掠的</p>
<p>攝食的</p>
<p>綻放的</p>
<p>枯萎的</p>
<p>春雨洗亮了鏡頭</p>
<p>不當優雅黑天鵝</p>
<p>樸拙的散發清麗</p>
<p>在空間之中擠身</p>
<p>在時間之下老去</p>
<p>存在於你的雙眼裡</p>
<p>逝去 </p>
<p>記憶揮去</p>
<p>目光散去</p>
<p>鏡頭下的絕不是虛擬</p>
<p>我有過的  美麗</p>
