    <div class="blog-content"><p><strong>作者</strong>：飛翔</p>
<p><strong>發文</strong>：2012-02-23</p>
<p><strong>瀏覽</strong>：73 次 ｜ <strong>回應</strong>：22 則</p>
<hr>
<p>抬頭看不見斑斕的教堂</p>
<p>沒有垂掛的時鐘響聲</p>
<p>遺忘了每張臉旁的經過</p>
<p>淡定悲喜  淡定悲喜</p>
<p>坐吧</p>
<p>疲累了請坐一坐</p>
<p>在葉片飄落之下</p>
<p>坐吧</p>
<p>仰望流光的瀟灑</p>
<p>俯拾記憶的種子</p>
<p>淡定悲喜  淡定悲喜</p>
<p>前生為木  此生當作椅</p>
<p>不擔心探索誰的秘密</p>
<p>無慰藉誰的悲傷心靈</p>
<p>沒有是非誰的感情</p>
<p>信念不朽</p>
<p>淡定悲喜  淡定悲喜</p>
<p>不就是來來往往的緣淺而已</p>
