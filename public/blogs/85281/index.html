<p>突然你跟我們告別
消失在這燦爛季節
曾拍下最美的一切
閃爍光芒卻不熄滅
逃不過殘酷的世界
卻離我們好遠好遠
翻出一堆紀念照片
太多回憶值得懷念
你飛你說要往那邊飛
不許我們掉下眼淚
當你走到平靜世界
害怕失去你的感覺
我追我拚命往那邊追
為何不能挽回一切
留下最後一滴眼淚
埋藏了紀念不忘記你是誰</p>
