<p>人參皂甘的做用</p>
<p>21世紀的抗癌新星─Rh2人參皂甘</p>
<p>人參對於人體的好處已是被證實的，因其產量稀少而滋補效果顯著，在世界上享有極高的美名，被譽為〝起死回生的仙草〞，然而，隨著科技的進步，人參中的有效成份被萃取出來，人們可以更有效率地透過精萃之後的人參萃取物(人參皂甘)，達到預防疾病的目的。</p>
