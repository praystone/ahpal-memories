<p>1.燕窩的確含有大量水溶性糖原蛋白質</p>
<p>2.碳水化合物，鈣，鐵，磷</p>
<p>3.長期使用對肺、氣管、皮膚都有很顯著的功效。燕窩具潤肺清血養顏美容之功效，自古即被奉為養生食補的聖品</p>
<p>4.本草綱目記載燕窩是「大養肺陰，化痰止嗽，補而能清，為調理虛勞之聖藥」，然而，這些功效目前仍缺乏臨床研究，不免讓人存疑，燕窩真有這些神奇功效嗎？</p>
