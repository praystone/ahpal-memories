    <div class="blog-content"><p><strong>作者</strong>：飛翔</p>
<p><strong>發文</strong>：2012-02-28</p>
<p><strong>瀏覽</strong>：84 次 ｜ <strong>回應</strong>：13 則</p>
<hr>
<p>邊緣啊</p>
<p>心的邊緣  最遠的一個點</p>
<p>原諒我不能說出的細節</p>
<p>說宇宙 說永遠</p>
<p>階梯之上</p>
<p>移動  等待的</p>
<p>疲乏又衝動著期待</p>
<p>轉身九十度</p>
<p>俯視一階階的墜下</p>
<p>別在背後呼喊</p>
<p>我不打算回過頭</p>
<p>只專注的  行走</p>
<p>片刻的逗留</p>
<p>可以當作我的小消磨</p>
<p>何需理會苦與樂</p>
<p>甘願受</p>
<p>邊緣啊</p>
<p>笑中帶淚的那個小光點</p>
<p>你不要去觸摸</p>
<p>不要</p>
<p>掀起舊傷口</p>
