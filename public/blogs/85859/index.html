<p>你怎麼捨得讓我的淚流向海
付出的感情永遠找不回來
你怎麼捨得讓我的愛流向海
傷心的往事一幕幕就像潮水
將我淹埋
閉上了雙眼還看見和你的纏綿
眼角的淚水洗不去心中
一遍一遍的誓言</p>
