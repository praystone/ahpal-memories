<p>茫茫人海到處飄飄盪盪
逆風而行不得不倔強
早己經習慣影子
空心　孤單透明的綑綁
怕荒蕪流不出眼淚
誰來救我除了你
抓住我別讓我溜走
我的心只有你能收
自言自語　自己討厭自己
收起所有的鏡子逃避
斷翅的靈魂　無法飛出眼眸
躲在床單裡嘆息</p>
