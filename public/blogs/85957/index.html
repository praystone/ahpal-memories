<p>生物系學生做實驗</p>
<p>一個生物系學生做實驗，</p>
<p>一次他把一只跳蚤的腳切掉二只，</p>
<p>然后對著跳蚤說：「跳！」　　</p>
<p>跳蚤跳..　于是他再切斷二只，</p>
<p>又對著跳蚤說：「跳！」　</p>
<p>跳蚤依然照跳不誤..最后他又再切斷二只腳，</p>
<p>　然后又對跳蚤喊：「跳！」　</p>
<p>這時跳蚤再也跳不動了..　</p>
<p>于是他寫下了心得～</p>
<p>「跳蚤在切短斷六只腳后，就變成聾子了！」</p>
