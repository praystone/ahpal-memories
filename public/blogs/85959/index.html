<p>同未婚妻吵了一架</p>
<p>年輕的士兵收到了一封家鄉來信，</p>
<p>當他拆開信封，</p>
<p>從裡面取出的卻是一張白紙。</p>
<p>　　“這是怎么回事呢？”</p>
<p>朋友問。“事情是這樣的，”</p>
<p>士兵說，“在我離開家鄉時我同未婚妻吵了一架，</p>
<p>從那以後，我們一直誰都不跟誰講話。”</p>
