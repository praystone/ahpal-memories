<p>霧來了我被趕到記憶的窗口
你走了世界只剩下貓來陪我
我在回憶裡尋找你的蹤影
琴聲一段一段說出愛的心情
貓在鋼琴上留下夢的腳印
誰在一步一步牽引你的背影
貓在鋼琴上睡著了悲傷的情歌特別溫柔
我陪你最久季節已深秋
美麗的開頭不一定有美麗的結果
貓在鋼琴上睡著了你走了以後寂寞不休
柔柔的指頭輕輕地彈奏
最美的情歌總是寫在心碎的時候</p>
