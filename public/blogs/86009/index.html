<li>
<p>食物︰rn豬腳、豬尾巴、雞腳、牛肉、筋蹄類、海參</p>
</li>
<li>
<p>功效︰rn這類食物所含膠質都很豐富，具有很好的豐胸效果，而且肉類除了蛋白質外，也含有脂肪，而適量的脂肪更是胸部發育不可或缺的。此外，肉類也是蛋白質的主要來源之一，而蛋白質亦可促進荷爾蒙發育，幫助咪咪發育。</p>
