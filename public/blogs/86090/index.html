<p>有一天我在開車時，意識到閃光燈閃了一下。</p>
<p>我心想應該是測速照相，但我很肯定沒有超速。</p>
<p>為了確認，我繞回原處，這次開得更慢，</p>
<p>沒想到照相機還是閃了一下。</p>
<p>我覺得很有趣，就連續又繞了三次，</p>
<p>每次以龜速經過 同一地方，照相機都閃一下。</p>
<p>兩週後我收到五張罰單，都是因為沒有繫安全帶 !</p>
<p> </p>
