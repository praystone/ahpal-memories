<p>徘徊在每條走過的街期待妳的出現
留戀每一個有妳的夜溫暖我心扉
懷念著妳帶來的季節擋住寒風也趕走冰雪
只有那微風輕拂我的臉細語一遍又一遍
難以忘卻妳散發的香味成熟中又隱露著嬌媚
妳的一切總好的讓人陶醉卻又將我心跌個粉碎</p>
