<p>春。</p>
<p> </p>
<p> </p>
<p>我撥開你蒼茫髮絲交織成的簾幕，走進春的天空。</p>
<p> </p>
<p>我輕倚你身，手上是你辛勤的淚珠，夾在那半葉的嫩綠。</p>
<p> </p>
<p>撫過你傷痕交錯的手臂，輕讀你百年的風霜。</p>
<p> </p>
<p>綠意竄上枝頭，為那悲戚了一個冬天的花樹，添新妝。</p>
<p>微風中帶著一抹清淡的雅香，是鄉愁，是相思，是滄桑?</p>
<p> </p>
<p>是為春回大地的欣歡，鼓舞，又或為冬遠天空的離愁，唱詞?</p>
