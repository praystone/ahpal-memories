<hr>
<p>「在這個世上並不存在著被人需要的人」</p>
<p> </p>
<p>這是一個讓人不融置疑的真理。</p>
<p> </p>
<p>如果有被人所需要的人存在的話.那一定是他能發揮一種作用.而</p>
<p>即然是作用，那當然是可以被人取代的。</p>
<p> </p>
<p>所以，所謂的那些無法取代的人..充其量不過是種似是而非的論調，其實也只不過是不被需要的人。</p>
