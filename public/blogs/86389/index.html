<p>桃子果醬瑞士捲</p>
<p>我家桃樹正當成熟之際，每天都要掉廿幾個下來，親友早已送過一輪，廚房桌上隨時有十幾個排隊，等著被吃哪！</p>
<p>實在來不及吃，今天想到何不來做桃子果醬？總算一口氣解決了五十個桃子，做完果醬再做一個瑞士捲，哈哈！現成的最新鮮內餡，很好吃喔！</p>
