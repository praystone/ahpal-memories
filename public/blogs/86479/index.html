    <div class="blog-content"><p><strong>作者</strong>：飛翔</p>
<p><strong>發文</strong>：2012-03-07</p>
<p><strong>瀏覽</strong>：107 次 ｜ <strong>回應</strong>：12 則</p>
<hr>
<p>一處靜謐  結滿相思蒂</p>
<p>怎藏匿  不藏匿</p>
<p>往事記憶恆攝腦海裡</p>
<p>關於愛  是灑遍的甘露</p>
<p>需細膩  細膩地護著妳</p>
<p>夏夜織雲衣為你披</p>
<p>秋盡覆帳羅網妳愁</p>
<p>不落的小太陽做舵手</p>
<p>在每一季的迷航裡當妳的導遊</p>
<p>怎藏匿  不藏匿</p>
<p>就架著光陰飛到妳那裡</p>
<p>不攜虹  不帶蝶</p>
<p>黃野花送給妳</p>
<p>滿滿的春意 </p>
<p>我</p>
<p>愛</p>
<p>妳</p>
<p>  </p>
