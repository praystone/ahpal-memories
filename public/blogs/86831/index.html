<p> </p>
<p> </p>
<p>女兒出嫁異地那天，他摟著她的肩說：還有我；</p>
<p>他收到她病危通知的那天，重複地對她說：我在這；</p>
<p>她要走的那一刻，他親吻她的額頭輕聲說：你等我。</p>
<p>這一生，他沒對她說過一次“我愛你”，但愛，從未離開過。</p>
