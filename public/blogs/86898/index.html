<hr>
<p>人生若像 浮沉的海湧
袂凍風平浪靜 欣賞光景
前塵往事一層層 回首心灰意冷
找無靠岸 暫時借停
命中注定 坎坷的愛情
離合悲歡只有聽天由命
明知歲月無情 偏偏風雨無停
欠妳的情 早慢阮會還
今生未了情 情未了 海中來 火中去 的煎熬
夢中情 夢中還 還不夠 來生緣 再回頭 陪妳到老
千里迢迢 情路遙遙 落葉飄飄想妳在今宵</p>
