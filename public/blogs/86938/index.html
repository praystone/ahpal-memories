<p>世事難料  
冰雪何足光豔也不如春花美妙
輕輕領著笑容駐足
半透粉的嬌羞猶似少女戀愛
打開   打開
打開心房接受那喜孜孜的好風采
別這樣說愁又弄憂
那些點綴是精靈的花冠
決不是誤判的眼淚
如何說是妒忌
正分享喜悅到你懷裡
迷戀   迷戀
大好的春光
悄悄攀上枝頭呼喚生命</p>
