<p>桃子收成進入尾聲</p>
<p>這兩天桃子收成進入尾聲，實在是太多了，今天又做了一次果醬，這回我是用麵包機來做的，這樣就不必站在爐子前「罰站」啦！因為放大量的糖的緣故，製作過程中不可離開一步，否則一眨眼就會焦鍋。</p>
<p>先用食物調理機打碎</p>
<p>再麵包機來做果醬，用裝入消毒過的空瓶即可</p>
