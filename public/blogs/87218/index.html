<p>（中央社記者楊明珠東京14日專電）台北時間8時5分，日本千葉縣東方外海觀測到芮氏規模6.1強震。地震深度10公里。千葉縣東北部觀測到「震度5強」的強烈搖晃。茨城縣的東海第二核電廠尚未傳出異狀。1010314</p>
