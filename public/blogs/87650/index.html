<p><strong>瀏覽</strong>：75 次 ｜ <strong>回應</strong>：13 則</p>
<hr>
<p>杜鵑花開了 在我這多雨的時節
杜鵑花開了
在陽光下你的天空</p>
<p>她是帶來繽紛的使者
溫柔的一如新嫁娘
嬌俏地流瀉青春</p>
<p>她是冬焰愁向之後的胭脂
逗留旅者疲憊腳步
華麗的演出一季幸福</p>
<p>杜鵑花開了
在這多事的三月天
杜鵑花開了
在我心頭滋長一株愛戀</p>
