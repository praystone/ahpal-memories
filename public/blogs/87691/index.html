<p>社會中心／綜合報導</p>
<p>日前退休調查專員丁祖伋以「花布包母」就醫照，在網路上引起熱烈迴響，一句「小時候媽媽背你，長大了，你會背媽媽嗎？」的敘述，讓網友感觸良多，封丁祖伋為「孝行哥」，然而今（15）日卻有消息傳出，孝行哥的母親已病故醫院。</p>
