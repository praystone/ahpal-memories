<p>真正的幸福是一點一點爭取的，一天一天積累的。 不要去傷害喜歡你的人，也不要讓你喜歡的人受傷害。
成熟不是看你的年齡有多大，而是看你的肩膀能挑起多重的責任。 
喜歡一個人要誠心相待、真心交流。 
不要計較太多的得與失，要學會用一顆寬容的心包容對方的缺點與失誤。</p>
