<p>小明和小華正熱烈的擁吻，小明極端的興奮的將自己的拉鍊打開。</p>
<p>小華：小明你怎麼了?</p>
<p>小明熱情的看著小華：我已經受不了了。</p>
<p>小華：快去吧!廁所在那裡</p>
<p>小明握著它說：唉呀!妳總該不會不知道這東西的功用吧!</p>
