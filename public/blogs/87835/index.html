<p>膨脹10倍上生理課，教授點名問一個女同學，</p>
<p> &ndash; 人體什麼部位在興奮時會脹大十倍。</p>
<p>女同學面紅耳赤，支吾無以對，</p>
<p>並抗議教授有『性騷擾』之嫌。</p>
<p>教授道：『從妳的反應，我有三點結論：
一、妳滿腦子充滿邪惡思想。
二、妳上課前根本沒有預習。
三、將來妳結婚後，一定會大失所望。</p>
<p>(答案是 眼睛的瞳孔) </p>
