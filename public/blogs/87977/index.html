    <div class="blog-content"><p><strong>作者</strong>：飛翔</p>
<p><strong>發文</strong>：2012-03-22</p>
<p><strong>瀏覽</strong>：83 次 ｜ <strong>回應</strong>：22 則</p>
<hr>
<p>打開封緘沉積的心扉</p>
<p>讓陽光洗滌  純淨</p>
<p>深鎖的  </p>
<p>讓風吹平你皺的眉</p>
<p>流浪不再美麗  陳舊光陰</p>
<p>淡然的愛  好不容易</p>
<p>記得珍惜  回憶</p>
<p>縱然都過去</p>
<p>過去還沒有死去</p>
<p>存入虛擬空間裡</p>
<p>打開顯示器</p>
<p>點進孤單領域</p>
<p>華麗燦爛的人生</p>
<p>縮影  </p>
<p>原來的情節</p>
<p>天堂與牢籠都在這裡</p>
<p>只想看見光芒</p>
<p>我守住了希望</p>
