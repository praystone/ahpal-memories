<p>結婚爸爸回家後，看見小明一直在哭，因此問他：「小明，你哭什麼？」</p>
<p>小明說：「隔壁叔叔有冰淇淋，都不給我吃，只給媽媽吃&hellip;」</p>
<p>爸爸說：「你怎麼知道？」</p>
<p>小明說：「因為媽媽對隔壁叔叔說&hellip;要快點舔，免得他軟化&hellip;」</p>
