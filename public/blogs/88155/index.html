<p>便便</p>
<p>某天三兄弟在公園裡散步時看見路中間有坨東西&quot;看起來像便便！&quot;</p>
<p>大哥說 &ldquo;我最好檢查一下&rdquo; 他彎下深吸了一口氣 &ldquo;聞起來像便便！&rdquo;</p>
<p>二哥走上前去把手指插進去感覺 &ldquo;摸起來像便便&rdquo; 他說。</p>
<p>三弟戳了一下放進嘴裡然後說 &ldquo;嘗起來也像便便！&rdquo;</p>
<p>三兄弟終於鬆了口氣說 &ldquo;幸好我們沒有踩到它!&rdquo;</p>
