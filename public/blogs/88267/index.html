<p>人生的際遇很奇妙在我生命中的最低潮時讓我遇見了你
在平靜無浪已久的心湖中 
投下了一顆小石子
在小石子入湖後
整個湖面產生了變化
看似平靜許久的心 
因為有你的參與 
又精彩活絡起來</p>
<p>相遇相守之後
只有一句話要說 
我要與你到永久</p>
