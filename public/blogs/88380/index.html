<p><strong>發文</strong>：2012-03-26</p>

<hr>
<p>終於等到好天晴
曝曬我的臉
蒸發我的憂鬱</p>
<p>蒼穹夜裏數星星</p>
<p>萬花星海裡</p>
<p>怎麼數也數不清</p>
<p>影兒細長偏移</p>
<p>彷彿夢囈</p>
<p>遠近都探不出究竟</p>
<p>好個春風拂臉</p>
<p>影兒卻不知憐</p>
<p>到底少了顆心</p>
<p>默猜疑</p>
<p>冷的是影</p>
<p>我還溫熱的在呼吸</p>
<p>  </p>
