<p>有一天，有一個男校來了一位新的女老師，
那位老師身材臉蛋都一級棒，
但是對學生的管教方式非常嚴格，
在升旗典禮上老師想說先給學生一個下馬威，
她上台說了一句話，全校學生都好高興&hellip;.她說：
你們都給我聽好!! 
我是全校逼最緊的老師!!!</p>
