<p>一個小女孩趴在窗臺上，</p>
<p>看窗外的人正埋葬她心愛的小狗，</p>
<p>不禁淚流滿面，</p>
<p>悲慟不已。</p>
<p>她的外祖父見狀，</p>
<p>連忙引她到另一個視窗，</p>
<p>讓她欣賞他的玫瑰花園。</p>
<p>果然小女孩的心情頓時明朗。</p>
<p>老人托起外孫女的下巴說：</p>
<p>孩子你開錯了窗戶。</p>
