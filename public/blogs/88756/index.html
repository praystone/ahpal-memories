<p>為什麼?</p>
<p>小魏打電話給女同學小美，</p>
<p>沒想到是她媽媽接的。 </p>
<p>小美的媽媽：</p>
<p>小美不在，請問你貴姓？ </p>
<p>小魏：我姓魏。 </p>
<p>小美的媽媽。</p>
<p>魏什麼？ </p>
<p>小魏：我&hellip;</p>
<p>我也不知道為什麼.</p>
<p>我爸爸姓魏，</p>
<p>我就跟著姓魏&hellip;.</p>
