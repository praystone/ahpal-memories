<p>有些人，抓住就是抓住了，錯過就是錯過了，只能說情深緣淺。人生的旅途中有太多的岔口，一轉身也許就是一輩子。錯過沿途的風景，錯過此時的雪季，錯過彼時的花季。天涯太遠，一生太長，花期荼迷，也抵不住荏苒時光。記憶更迭，誰蒼白了誰的等待，誰無悔著誰的執著。</p>
