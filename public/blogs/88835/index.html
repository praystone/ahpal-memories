<p><strong>發文</strong>：2012-03-31</p>
<p><strong>瀏覽</strong>：36 次 ｜ <strong>回應</strong>：5 則</p>
<hr>
<p>你一直真關心我　問熱問寒
你一直攏真疼我　當作心肝
為什麼今啊日你　攏毋看我　無愛我
無關心我　無疼惜我</p>
<p>牽著你的手　這呢冷
問你咁會寒　攏不應聲</p>
<p>搖著你的手　叫你的名
無聽見　無感覺　乎我心痛</p>
<p>你說一生中　最愛我
為什麼這忍心　放我孤單
不相信　你已經　離開我
我袂擱再聽你　叫我一句心肝</p>
<p>我袂擱再聽你　叫我一句心肝</p>
