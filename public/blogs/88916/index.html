<p>世上只有兩種悲劇：
 「得不到你想要的，
得到你不想要的。」</p>
<p>想要得到別人的愛，
首先要自己愛自己。
 相愛不是互看對方的眼睛，
 而是要有共同的目標，
理想，
話題，
朋友。
 
相愛容易相處難，
相處容易相信難，
相信容易相諒難。
 
「放開一點、
簡單一點、
單純一點；
 集滿三點，
就會開心一點哦！」</p>
<p>蕭伯納</p>
