<p>警犬</p>
<p>小明在報紙上看到有優良品種的警犬出售，</p>
<p>於是寄出支票購買。 </p>
<p>幾天後，</p>
<p>送來的卻是普通的雜種犬， </p>
<p>生氣的小明打電話去罵登廣告的人… </p>
<p>小明：「你們寄來的根本不是警犬，我要退錢！」</p>
<p>對方：「警犬有很多種，賣給你的是便衣，必須偽裝成不是警犬！」</p>
