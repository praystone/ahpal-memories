<p>好冷啊</p>
<p>一個男生約了心儀的女孩上山看夜景，</p>
<p>萬家燈火，甚是美麗，此時 </p>
<p>一陣涼風吹來。男的低頭問：</p>
<p>『妳冷不冷？』</p>
<p>女孩心想他真體貼！</p>
<p>並回答：『不冷！謝謝 ！』</p>
<p>男孩說：『那妳外套可不可以脫下來給我穿，我好冷喔！』</p>
