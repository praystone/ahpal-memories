<p>還好</p>
<p>有一個女的和一個男的去上山看夜景約會，那天晚上很冷，女的故意沒穿外套，想給男的</p>
<p>有表現的機會。</p>
<p>女：「今天好冷喔！我忘了穿外套了（滿心期待）」</p>
<p>男（拉緊衣服）：『還好還好，我有記得穿，否則真的會跟妳一樣，冷死了！（露出滿足</p>
<p>的笑容）』</p>
<p>女：&hellip;&hellip;.</p>
