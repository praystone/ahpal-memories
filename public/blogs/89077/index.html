<p>一年級的老師教小朋友認識家禽動物。</p>
<p>老師：「有一種動物兩隻腳，</p>
<p>每天早上太陽公公出來時，</p>
<p>牠都會叫你起床，</p>
<p>而且叫到你起床為止，</p>
<p>是哪一種動物？」</p>
<p>小朋友：「媽媽！」</p>
