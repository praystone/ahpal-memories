<hr>
<p>風沙揚起</p>
<p>捲簾我愁向的眼睛</p>
<p>錯看了山邊風景</p>
<p>錯過了漁帆遠影</p>
<p>眼睜睜的讓尖端刺向我的心</p>
<p>這裡沒有上帝的忠告</p>
<p>只有靈性的皈依</p>
<p>血淋淋的捧著心</p>
<p>隨你踐踏的只是外顯的分子結構</p>
<p>我良善的魂魄還樂著</p>
<p>在光芒之上</p>
<p>我深信比誰都榮耀</p>
<p>因為魂魄無所求</p>
<p>你只是比黑暗更深的嘲弄</p>
<p>掙扎藍天之下</p>
